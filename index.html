
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#071320">
<title>Ice Cam 1.3</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050c17;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
video{display:none}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 18px);pointer-events:none}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.brand{font-size:23px;font-weight:900;text-shadow:0 2px 8px #000}
#status{max-width:57%;padding:11px;border-radius:16px;background:#10283edc;border:1px solid #bdefff33;font-size:12px;text-align:center;backdrop-filter:blur(10px)}
.controls{display:grid;gap:11px}
.hint{text-align:center;font-size:13px;line-height:1.5;text-shadow:0 2px 8px #000}
button{pointer-events:auto;width:100%;padding:17px;border:0;border-radius:17px;font-size:16px;font-weight:800;background:#9be8ff;color:#092033}
button.secondary{background:#ffffff38;color:#fff;backdrop-filter:blur(12px)}
button:disabled{opacity:.5}
#overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(#173e5b,#030914 75%);padding:25px}
.panel{max-width:360px;width:100%}
.panel h1{font-size:40px}
.panel p{line-height:1.5;color:#d6e7f2}
#error{color:#ffb9a5;white-space:pre-wrap;font-size:13px}
#debug{display:none;padding:12px;background:#162a3de8;border-radius:12px;font-size:12px;white-space:pre-wrap;max-height:140px;overflow:auto;pointer-events:auto}
#debug.show{display:block}
</style>
</head>
<body>
<video id="video" autoplay muted playsinline></video>
<canvas id="scene"></canvas>

<div class="ui">
 <div class="top">
  <div class="brand">❄️ ICE CAM</div>
  <div id="status">Камера выключена</div>
 </div>
 <div class="controls">
  <div id="debug"></div>
  <div class="hint">
   ✋ Раскрой ладонь — экран покрывается инеем.
   🩵 Направь раскрытую руку вперёд — ледяной выстрел.
  </div>
  <button id="scan" disabled>✋ Включить магию</button>
  <button id="switch" class="secondary" disabled>↻ Сменить камеру</button>
 </div>
</div>

<div id="overlay">
 <div class="panel">
  <h1>❄️ ICE CAM</h1>
  <p>Замораживай мир ледяной магией</p>
  <button id="start">Включить камеру</button>
  <p id="error"></p>
 </div>
</div>

<script type="module">
const $=id=>document.getElementById(id);
const video=$("video");
const canvas=$("scene");
const ctx=canvas.getContext("2d",{alpha:false});
const scanBtn=$("scan");
const switchBtn=$("switch");
const status=$("status");
const debug=$("debug");

const BASES=[
 "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14",
 "https://unpkg.com/@mediapipe/tasks-vision@0.10.14"
];

const MODEL="https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

let detector=null,stream=null;
let running=false,scanning=false,loading=false;
let facing="environment";

let W=0,H=0,scale=1,dx=0,dy=0;
let frost=0,frostTarget=0;
let beam=0,beamTarget=0;
let openFrames=0,closedFrames=0;
let aimFrames=0,missFrames=0;
let lastSeen=0,lastVideoTime=-1;
let lastDetection=0,lastTick=0;

let hand={x:0,y:0,size:60,ux:0,uy:-1};
let particles=[];

const frostCanvas=document.createElement("canvas");
const fc=frostCanvas.getContext("2d");

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function setStatus(s){
 status.textContent=s;
}

function showError(s){
 debug.textContent=s;
 debug.classList.add("show");
 console.error(s);
}

function clearError(){
 debug.textContent="";
 debug.classList.remove("show");
}

function resize(){
 if(!video.videoWidth)return;

 const d=Math.min(devicePixelRatio||1,1.5);
 W=canvas.width=Math.round(innerWidth*d);
 H=canvas.height=Math.round(innerHeight*d);

 scale=Math.max(
  W/video.videoWidth,
  H/video.videoHeight
 );

 dx=(W-video.videoWidth*scale)/2;
 dy=(H-video.videoHeight*scale)/2;

 frostCanvas.width=W;
 frostCanvas.height=H;

 generateFrost();
}

addEventListener("resize",resize);

function drawVideo(){
 ctx.save();
 ctx.translate(dx,dy);

 if(facing==="user"){
  ctx.translate(video.videoWidth*scale,0);
  ctx.scale(-1,1);
 }

 ctx.drawImage(
  video,0,0,
  video.videoWidth*scale,
  video.videoHeight*scale
 );

 ctx.restore();
}

function point(p){
 return{
  x:dx+(facing==="user"?1-p.x:p.x)
    *video.videoWidth*scale,
  y:dy+p.y*video.videoHeight*scale
 };
}

function isOpenPalm(p){
 let n=0;

 for(const [tip,joint] of [
  [8,6],[12,10],[16,14],[20,18]
 ]){
  if(dist(p[tip],p[0])>
     dist(p[joint],p[0])*1.13){
   n++;
  }
 }

 return n>=3;
}

function handleDetection(result,time){
 const raw=result?.landmarks?.[0];

 if(!raw){
  if(time-lastSeen>280){
   closedFrames++;
   openFrames=0;
   missFrames++;
   aimFrames=0;

   if(closedFrames>=4)frostTarget=0;
   if(missFrames>=3)beamTarget=0;

   setStatus("✋ Покажи руку");
  }
  return;
 }

 lastSeen=time;

 const p=raw.map(point);
 const open=isOpenPalm(p);

 const center={
  x:(p[5].x+p[9].x+p[13].x+p[17].x)/4,
  y:(p[5].y+p[9].y+p[13].y+p[17].y)/4
 };

 const tip={
  x:(p[8].x+p[12].x+p[16].x)/3,
  y:(p[8].y+p[12].y+p[16].y)/3
 };

 const vx=tip.x-p[0].x;
 const vy=tip.y-p[0].y;
 const len=Math.hypot(vx,vy)||1;
 const ux=vx/len;
 const uy=vy/len;
 const size=dist(p[5],p[17]);

 if(!hand.x){
  hand.x=tip.x;
  hand.y=tip.y;
 }

 hand.x=lerp(hand.x,tip.x,.32);
 hand.y=lerp(hand.y,tip.y,.32);
 hand.size=lerp(hand.size,size,.2);
 hand.ux=lerp(hand.ux,ux,.28);
 hand.uy=lerp(hand.uy,uy,.28);

 if(open){
  openFrames++;
  closedFrames=0;
  if(openFrames>=3)frostTarget=1;
 }else{
  closedFrames++;
  openFrames=0;
  if(closedFrames>=4)frostTarget=0;
 }

 // Жест: раскрытая ладонь, пальцы вверх.
 const aim=open&&uy<-.48&&
  dist(tip,center)>size*.55;

 if(aim){
  aimFrames++;
  missFrames=0;
  if(aimFrames>=3)beamTarget=1;
 }else{
  missFrames++;
  aimFrames=0;
  if(missFrames>=3)beamTarget=0;
 }

 if(beamTarget){
  setStatus("🩵 ЛЕДЯНОЙ ЛУЧ");
 }else if(frostTarget){
  setStatus("❄️ Экран замерзает");
 }else{
  setStatus("✋ Раскрой ладонь");
 }
}

let seed=18429;

function rnd(){
 seed=(seed*1664525+1013904223)>>>0;
 return seed/4294967296;
}

function generateFrost(){
 const c=fc,w=W,h=H;
 c.clearRect(0,0,w,h);
 seed=18429;

 const g=c.createRadialGradient(
  w*.5,h*.5,Math.min(w,h)*.06,
  w*.5,h*.5,Math.max(w,h)*.74
 );

 g.addColorStop(0,"rgba(180,235,255,0)");
 g.addColorStop(.43,"rgba(190,238,255,.045)");
 g.addColorStop(.67,"rgba(205,242,255,.24)");
 g.addColorStop(.86,"rgba(228,249,255,.63)");
 g.addColorStop(1,"rgba(244,253,255,.92)");

 c.fillStyle=g;
 c.fillRect(0,0,w,h);

 function branch(x,y,a,l,d){
  if(d<=0||l<2)return;

  const nx=x+Math.cos(a)*l;
  const ny=y+Math.sin(a)*l;

  c.strokeStyle=d>3?
   "rgba(245,254,255,.7)":
   "rgba(210,243,255,.5)";

  c.lineWidth=Math.max(.7,w/900)*d/3;

  c.beginPath();
  c.moveTo(x,y);
  c.lineTo(nx,ny);
  c.stroke();

  if(d>1){
   const mx=lerp(x,nx,.58);
   const my=lerp(y,ny,.58);

   branch(mx,my,a+.57,l*.52,d-1);
   branch(mx,my,a-.57,l*.52,d-1);
   branch(nx,ny,a+(rnd()-.5)*.2,l*.76,d-1);
  }
 }

 for(let i=0;i<90;i++){
  const side=i%4;
  let x,y,a;

  if(side===0){
   x=rnd()*w;y=0;
   a=Math.PI/2+(rnd()-.5)*1.4;
  }else if(side===1){
   x=w;y=rnd()*h;
   a=Math.PI+(rnd()-.5)*1.4;
  }else if(side===2){
   x=rnd()*w;y=h;
   a=-Math.PI/2+(rnd()-.5)*1.4;
  }else{
   x=0;y=rnd()*h;
   a=(rnd()-.5)*1.4;
  }

  branch(
   x,y,a,
   Math.min(w,h)*(.08+rnd()*.16),
   5
  );
 }

 for(let i=0;i<2300;i++){
  const x=rnd()*w;
  const y=rnd()*h;

  const e=Math.max(
   Math.abs(x/w-.5)*2,
   Math.abs(y/h-.5)*2
  );

  if(rnd()>e*.9)continue;

  c.fillStyle=
   `rgba(241,253,255,${.08+rnd()*.42})`;

  const s=.5+rnd()*2.6;
  c.fillRect(x,y,s,s);
 }
}

function drawFrost(t){
 if(frost<.002)return;

 ctx.save();

 ctx.fillStyle=
  `rgba(75,161,230,${frost*.17})`;

 ctx.fillRect(0,0,W,H);

 ctx.globalAlpha=clamp(frost*1.3,0,1);
 ctx.drawImage(frostCanvas,0,0);

 const heavy=clamp((frost-.45)/.55,0,1);

 if(heavy>0){
  ctx.globalAlpha=heavy*.5;
  ctx.drawImage(frostCanvas,0,0);

  ctx.globalAlpha=heavy*.13;
  ctx.fillStyle="#d2f5ff";
  ctx.fillRect(0,0,W,H);
 }

 ctx.restore();
}

function drawBeam(t,dt){
 if(beam<.012)return;

 const x=hand.x;
 const y=hand.y;

 // Луч направлен в глубину сцены.
 const steering=clamp(hand.ux,-.9,.9);

 const farX=clamp(
  x+steering*W*.34,
  W*.12,W*.88
 );

 const farY=clamp(
  y-H*.29,
  H*.12,H*.72
 );

 const near=clamp(hand.size*.42,13,W*.085);
 const far=near*.10;

 const nx=farX-x;
 const ny=farY-y;
 const length=Math.hypot(nx,ny)||1;

 const px=-ny/length;
 const py=nx/length;

 const pulse=.92+.08*Math.sin(t*.017);

 ctx.save();
 ctx.globalCompositeOperation="screen";

 // Плавный луч, широкий возле пальцев
 // и узкий вдали.
 function plume(mult,alpha,c1,c2){
  const g=ctx.createLinearGradient(
   x,y,farX,farY
  );

  g.addColorStop(0,c1);
  g.addColorStop(.5,c2);
  g.addColorStop(
   1,"rgba(90,225,255,0)"
  );

  ctx.beginPath();

  for(const side of [-1,1]){
   for(let i=0;i<=36;i++){
    const q=(side===-1?i:36-i)/36;
    const taper=Math.pow(1-q,1.35);

    const wobble=
     Math.sin(q*24-t*.019+side)*
     near*.075*taper;

    const r=(
     far+(near-far)*taper
    )*mult*pulse+wobble;

    const cx=x+nx*q;
    const cy=y+ny*q;

    const xx=cx+px*r*side;
    const yy=cy+py*r*side;

    if(side===-1&&i===0){
     ctx.moveTo(xx,yy);
    }else{
     ctx.lineTo(xx,yy);
    }
   }
  }

  ctx.closePath();
  ctx.globalAlpha=beam*alpha;
  ctx.fillStyle=g;
  ctx.fill();
 }

 plume(
  2.25,.28,
  "rgba(39,172,255,.68)",
  "rgba(25,128,255,.30)"
 );

 plume(
  1.35,.62,
  "rgba(63,217,255,.92)",
  "rgba(52,182,255,.68)"
 );

 plume(
  .67,.78,
  "rgba(145,243,255,.97)",
  "rgba(125,225,255,.78)"
 );

 plume(
  .23,.76,
  "rgba(238,255,255,.93)",
  "rgba(193,250,255,.74)"
 );

 // Свечение у кончиков пальцев.
 const glow=ctx.createRadialGradient(
  x,y,0,x,y,near*2.6
 );

 glow.addColorStop(
  0,"rgba(232,255,255,.92)"
 );
 glow.addColorStop(
  .25,"rgba(111,229,255,.65)"
 );
 glow.addColorStop(
  1,"rgba(45,165,255,0)"
 );

 ctx.globalAlpha=beam*.8;
 ctx.fillStyle=glow;

 ctx.beginPath();
 ctx.arc(x,y,near*2.6,0,Math.PI*2);
 ctx.fill();

 // Ледяные осколки вдоль луча.
 const n=Math.min(9,Math.ceil(dt*.22));

 for(
  let i=0;
  i<n&&particles.length<170;
  i++
 ){
  const q=Math.random()*.18;

  particles.push({
   x:x+nx*q+
    px*(Math.random()-.5)*near,
   y:y+ny*q+
    py*(Math.random()-.5)*near,
   vx:nx*(.013+Math.random()*.015),
   vy:ny*(.013+Math.random()*.015),
   life:26+Math.random()*18,
   max:44,
   r:1+Math.random()*2.4
  });
 }

 ctx.restore();
}

function drawParticles(dt){
 ctx.save();
 ctx.globalCompositeOperation="screen";

 const step=dt/16.67;

 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];

  p.x+=p.vx*step;
  p.y+=p.vy*step;
  p.life-=step;

  if(
   p.life<=0||
   p.x< -30||p.x>W+30||
   p.y< -30||p.y>H+30
  ){
   particles.splice(i,1);
   continue;
  }

  ctx.globalAlpha=
   clamp(p.life/30,0,1)*.85;

  ctx.fillStyle=
   i%3===0?"#ffffff":"#b9efff";

  ctx.beginPath();
  ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
  ctx.fill();
 }

 ctx.restore();
}

function render(t){
 if(!running)return;

 if(video.readyState>=2){
  if(!W||!H)resize();

  drawVideo();

  if(
   scanning&&detector&&
   video.currentTime!==lastVideoTime&&
   t-lastDetection>=65
  ){
   lastVideoTime=video.currentTime;
   lastDetection=t;

   try{
    handleDetection(
     detector.detectForVideo(video,t),t
    );
   }catch(e){
    showError(
     "Ошибка распознавания: "+e.message
    );
    stopScanning();
   }
  }

  const dt=Math.min(
   60,t-(lastTick||t)
  );

  if(scanning&&t-lastSeen>450){
   frostTarget=0;
   beamTarget=0;
  }

  if(frostTarget>frost){
   frost=Math.min(1,frost+dt/5200);
  }else{
   frost=Math.max(0,frost-dt/1900);
  }

  beam=lerp(
   beam,beamTarget,
   1-Math.exp(
    -dt/(beamTarget?130:220)
   )
  );

  drawFrost(t);
  drawBeam(t,dt);
  drawParticles(dt);
 }

 lastTick=t;
 requestAnimationFrame(render);
}

async function openCamera(){
 if(stream){
  stream.getTracks().forEach(
   track=>track.stop()
  );
 }

 stream=await navigator.mediaDevices.getUserMedia({
  audio:false,
  video:{
   facingMode:{ideal:facing},
   width:{ideal:1280},
   height:{ideal:720}
  }
 });

 video.srcObject=stream;
 await video.play();

 if(!video.videoWidth){
  await new Promise(resolve=>{
   video.addEventListener(
    "loadedmetadata",
    resolve,
    {once:true}
   );
  });
 }

 resize();

 lastVideoTime=-1;
 lastSeen=0;

 frost=0;
 frostTarget=0;
 beam=0;
 beamTarget=0;

 openFrames=closedFrames=aimFrames=missFrames=0;

 particles.length=0;
 hand.x=hand.y=0;
}

async function createDetector(){
 const errors=[];

 for(const base of BASES){
  try{
   setStatus("Загрузка модели...");

   const mod=await import(
    base+"/vision_bundle.mjs"
   );

   const files=
    await mod.FilesetResolver.forVisionTasks(
     base+"/wasm"
    );

   for(const delegate of ["GPU","CPU"]){
    try{
     return await mod.HandLandmarker.createFromOptions(
      files,{
       baseOptions:{
        modelAssetPath:MODEL,
        delegate
       },
       runningMode:"VIDEO",
       numHands:1,
       minHandDetectionConfidence:.55,
       minHandPresenceConfidence:.55,
       minTrackingConfidence:.5
      }
     );
    }catch(e){
     errors.push(
      delegate+": "+e.message
     );
    }
   }
  }catch(e){
   errors.push(base+": "+e.message);
  }
 }

 throw Error(errors.join("\n"));
}

function stopScanning(){
 scanning=false;
 frostTarget=0;
 beamTarget=0;

 openFrames=closedFrames=aimFrames=missFrames=0;

 scanBtn.textContent="✋ Включить магию";
 setStatus("Магия выключена");
}

async function startScanning(){
 if(loading)return;

 loading=true;
 scanBtn.disabled=true;
 scanBtn.textContent="⏳ Загрузка...";
 clearError();

 try{
  if(!detector){
   detector=await createDetector();
  }

  scanning=true;
  openFrames=closedFrames=aimFrames=missFrames=0;
  lastVideoTime=-1;

  scanBtn.textContent="⏹ Выключить магию";
  setStatus("✋ Покажи ладонь");
 }catch(e){
  scanning=false;

  showError(
   "Ошибка загрузки модели:\n"+e.message
  );

  setStatus("Ошибка сканирования");
  scanBtn.textContent="↻ Повторить";
 }finally{
  loading=false;
  scanBtn.disabled=false;
 }
}

scanBtn.onclick=()=>{
 if(loading)return;

 scanning?
  stopScanning():
  startScanning();
};

$("start").onclick=async()=>{
 const btn=$("start");
 btn.disabled=true;
 $("error").textContent="";

 try{
  if(!navigator.mediaDevices?.getUserMedia){
   throw Error(
    "Нужен HTTPS и доступ к камере"
   );
  }

  await openCamera();

  $("overlay").style.display="none";
  scanBtn.disabled=false;
  switchBtn.disabled=false;

  if(!running){
   running=true;
   requestAnimationFrame(render);
  }

  setStatus("Камера работает");
 }catch(e){
  $("error").textContent=e.message;
 }finally{
  btn.disabled=false;
 }
};

switchBtn.onclick=async()=>{
 switchBtn.disabled=true;

 const old=facing;

 facing=facing==="user"?
  "environment":"user";

 try{
  await openCamera();

  setStatus(
   scanning?
    "✋ Покажи ладонь":
    "Камера работает"
  );
 }catch(e){
  facing=old;
  showError(
   "Ошибка камеры: "+e.message
  );
 }

 switchBtn.disabled=false;
};
</script>
</body>
</html>
