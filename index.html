
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fire Cam</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#08080a;color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,Arial
}
video{display:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
.ui{
 position:fixed;inset:0;pointer-events:none;
 padding:calc(env(safe-area-inset-top) + 16px) 16px
 calc(env(safe-area-inset-bottom) + 18px);
 display:flex;flex-direction:column;
 justify-content:space-between
}
.top,.bottom{
 display:flex;align-items:center;
 justify-content:space-between;gap:12px
}
.brand{font-weight:800;font-size:22px;text-shadow:0 2px 10px #000}
#status{
 font-size:12px;background:#111c;border-radius:12px;
 padding:10px;max-width:65%;overflow-wrap:anywhere
}
#detail{
 font-size:11px;max-width:65%;background:#111b;
 border-radius:10px;padding:8px;white-space:pre-wrap;
 max-height:90px;overflow:auto
}
.hint{font-size:13px;max-width:58%;text-shadow:0 2px 6px #000}
button{
 pointer-events:auto;background:#ff792e;border:0;
 border-radius:16px;padding:14px 17px;
 font-weight:700;font-size:15px;color:#1c0a02
}
#overlay{
 position:fixed;inset:0;z-index:5;
 background:radial-gradient(#402016,#08080a 75%);
 display:grid;place-items:center;padding:25px;text-align:center
}
.panel{max-width:380px}
.panel h1{font-size:36px}
.panel p{line-height:1.5;color:#ddd}
.hidden{display:none!important}
</style>
</head>
<body>
<video id="video" playsinline autoplay muted></video>
<canvas id="canvas"></canvas>

<div class="ui">
 <div>
  <div class="top">
   <div class="brand">🔥 FIRE CAM</div>
   <div id="status">Камера выключена</div>
  </div>
  <div id="detail" class="hidden"></div>
 </div>
 <div class="bottom">
  <div class="hint">
   Раскрой ладонь — огонь появится.
   Сожми кулак — погаснет.
  </div>
  <button id="switch" disabled>↻ Камера</button>
 </div>
</div>

<div id="overlay">
 <div class="panel">
  <h1>🔥 Fire Cam</h1>
  <p>Огненный шар над ладонью.
  Сначала включим камеру, затем распознавание.</p>
  <button id="start">Включить камеру</button>
  <p id="error"></p>
 </div>
</div>

<script type="module">
const $=id=>document.getElementById(id);
const video=$("video");
const canvas=$("canvas");
const ctx=canvas.getContext("2d");
const status=$("status");
const detail=$("detail");
const overlay=$("overlay");
const start=$("start");
const switchBtn=$("switch");

let stream=null;
let facing="environment";
let detector=null;
let running=false;
let hand=null;
let isOpen=false;
let energy=0;
let lastSeen=0;
let lastVideoTime=-1;
let lastDetect=0;
let w=0,h=0,scale=1,dx=0,dy=0;

const mask=document.createElement("canvas");
const mctx=mask.getContext("2d");
const fg=document.createElement("canvas");
const fctx=fg.getContext("2d");

function report(s,e){
 status.textContent=s;
 if(e){
  detail.classList.remove("hidden");
  detail.textContent=String(
   e?.stack||e?.message||e
  ).slice(0,500);
  console.error(e);
 }
}

function resize(){
 if(!video.videoWidth)return;
 const d=Math.min(devicePixelRatio||1,1.5);
 w=canvas.width=Math.round(innerWidth*d);
 h=canvas.height=Math.round(innerHeight*d);
 mask.width=fg.width=w;
 mask.height=fg.height=h;
 scale=Math.max(w/video.videoWidth,h/video.videoHeight);
 dx=(w-video.videoWidth*scale)/2;
 dy=(h-video.videoHeight*scale)/2;
}
addEventListener("resize",resize);

function cameraDraw(c){
 c.save();
 c.translate(dx,dy);
 if(facing==="user"){
  c.translate(video.videoWidth*scale,0);
  c.scale(-1,1);
 }
 c.drawImage(video,0,0,
  video.videoWidth*scale,
  video.videoHeight*scale);
 c.restore();
}

function pt(p){
 return {
  x:dx+(facing==="user"?1-p.x:p.x)*video.videoWidth*scale,
  y:dy+p.y*video.videoHeight*scale
 };
}

function dist(a,b){
 return Math.hypot(a.x-b.x,a.y-b.y);
}
function mix(a,b,t){
 return a+(b-a)*t;
}

function updateHand(result,t){
 const landmarks=result?.landmarks?.[0];
 if(!landmarks){
  if(t-lastSeen>220){
   hand=null;
   isOpen=false;
  }
  return;
 }
 lastSeen=t;
 const p=landmarks.map(pt);

 const palm={
  x:(p[0].x+p[5].x+p[9].x+p[17].x)/4,
  y:(p[0].y+p[5].y+p[9].y+p[17].y)/4
 };
 const direction={
  x:p[9].x-p[0].x,
  y:p[9].y-p[0].y
 };
 const span=dist(p[5],p[17]);

 let extended=0;
 for(const [tip,joint] of [
  [8,6],[12,10],[16,14],[20,18]
 ]){
  if(dist(p[tip],p[0])>
     dist(p[joint],p[0])*1.13){
   extended++;
  }
 }
 isOpen=extended>=3;

 const target={
  x:palm.x+direction.x*.55,
  y:palm.y+direction.y*.55,
  r:Math.max(15,Math.min(w*.3,span*.7)),
  points:p
 };

 if(!hand)hand=target;
 else{
  hand.x=mix(hand.x,target.x,.28);
  hand.y=mix(hand.y,target.y,.28);
  hand.r=mix(hand.r,target.r,.24);
  hand.points=p;
 }
}

function flame(x,y,r,t){
 ctx.save();
 ctx.globalCompositeOperation="screen";

 const glow=ctx.createRadialGradient(
  x,y,0,x,y,r*2.4
 );
 glow.addColorStop(0,"#ffe6a688");
 glow.addColorStop(.35,"#ff8a2855");
 glow.addColorStop(1,"#ff330000");
 ctx.fillStyle=glow;
 ctx.beginPath();
 ctx.arc(x,y,r*2.4,0,Math.PI*2);
 ctx.fill();

 for(let i=0;i<48;i++){
  const q=(i*.618+t*(.25+(i%5)*.02))%1;
  const a=i*2.399+t*.4;
  const px=x+Math.cos(a)*r*q*.8;
  const py=y+Math.sin(a)*r*q*.5-q*r*.55;
  const s=r*(.1+.2*(1-q));

  const g=ctx.createRadialGradient(
   px,py,0,px,py,s*2
  );
  g.addColorStop(0,"#fff6d9cc");
  g.addColorStop(.35,"#ff9e25bb");
  g.addColorStop(1,"#ff340000");
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(px,py,s*2,0,Math.PI*2);
  ctx.fill();
 }

 const core=ctx.createRadialGradient(
  x-r*.2,y-r*.2,0,x,y,r
 );
 core.addColorStop(0,"#fffde8");
 core.addColorStop(.25,"#ffe78a");
 core.addColorStop(.6,"#ff8d1a");
 core.addColorStop(1,"#e9310000");
 ctx.fillStyle=core;
 ctx.beginPath();
 ctx.arc(x,y,r*(1+.04*Math.sin(t*8)),0,Math.PI*2);
 ctx.fill();

 ctx.restore();
}

function drawOcclusion(p){
 mctx.clearRect(0,0,w,h);
 mctx.fillStyle="#fff";
 mctx.strokeStyle="#fff";
 mctx.lineJoin="round";
 mctx.lineCap="round";

 mctx.beginPath();
 [0,1,2,5,9,13,17].forEach((id,i)=>{
  if(i)mctx.lineTo(p[id].x,p[id].y);
  else mctx.moveTo(p[id].x,p[id].y);
 });
 mctx.closePath();
 mctx.fill();

 const span=dist(p[5],p[17]);
 const chains=[
  [0,1,2,3,4],
  [0,5,6,7,8],
  [0,9,10,11,12],
  [0,13,14,15,16],
  [0,17,18,19,20]
 ];

 for(const chain of chains){
  mctx.lineWidth=span*.19;
  mctx.beginPath();
  chain.forEach((id,i)=>{
   if(i)mctx.lineTo(p[id].x,p[id].y);
   else mctx.moveTo(p[id].x,p[id].y);
  });
  mctx.stroke();
 }

 fctx.clearRect(0,0,w,h);
 cameraDraw(fctx);
 fctx.globalCompositeOperation="destination-in";
 fctx.drawImage(mask,0,0);
 fctx.globalCompositeOperation="source-over";
 ctx.drawImage(fg,0,0);
}

function render(t){
 if(!running)return;

 if(video.readyState>=2){
  ctx.clearRect(0,0,w,h);
  cameraDraw(ctx);

  if(detector &&
     video.currentTime!==lastVideoTime &&
     t-lastDetect>40){
   lastVideoTime=video.currentTime;
   lastDetect=t;

   try{
    const res=detector.detectForVideo(video,t);
    updateHand(res,t);
    status.textContent=res.landmarks?.length?
     (isOpen?"🔥 Ладонь открыта":"Раскрой ладонь"):
     "Покажи ладонь";
   }catch(e){
    report("Ошибка распознавания",e);
    detector=null;
   }
  }

  energy+=((hand&&isOpen?1:0)-energy)*.13;

  if(hand&&energy>.015){
   ctx.save();
   ctx.globalAlpha=Math.min(1,energy);
   flame(hand.x,hand.y,hand.r*energy,t/1000);
   ctx.restore();
   drawOcclusion(hand.points);
  }
 }

 requestAnimationFrame(render);
}

async function openCamera(){
 if(stream){
  stream.getTracks().forEach(tr=>tr.stop());
 }
 stream=await navigator.mediaDevices.getUserMedia({
  audio:false,
  video:{
   facingMode:{ideal:facing},
   width:{ideal:1280},
   height:{ideal:720}
  }
 });

 video.srcObject=stream;
 await video.play();

 if(!video.videoWidth){
  await new Promise(resolve=>{
   video.addEventListener(
    "loadedmetadata",resolve,{once:true}
   );
  });
 }

 resize();
 hand=null;
 isOpen=false;
 energy=0;
 lastVideoTime=-1;
}

// Резервные источники MediaPipe
const SOURCES=[
 {
  js:"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm",
  wasm:"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
 },
 {
  js:"https://unpkg.com/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs",
  wasm:"https://unpkg.com/@mediapipe/tasks-vision@0.10.22/wasm"
 }
];

const MODEL_URLS=[
 "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
 "https://cdn.jsdelivr.net/gh/google-ai-edge/mediapipe@master/mediapipe/tasks/testdata/vision/hand_landmarker.task"
];

async function loadModel(){
 let errors=[];

 for(const source of SOURCES){
  try{
   report("Загрузка библиотеки...");

   const mod=await import(source.js);
   const vision=await mod.FilesetResolver.forVisionTasks(
    source.wasm
   );

   for(const modelAssetPath of MODEL_URLS){
    for(const delegate of ["GPU","CPU"]){
     try{
      report("Загрузка модели ("+delegate+")...");

      return await mod.HandLandmarker.createFromOptions(
       vision,{
        baseOptions:{modelAssetPath,delegate},
        runningMode:"VIDEO",
        numHands:1,
        minHandDetectionConfidence:.55,
        minHandPresenceConfidence:.55,
        minTrackingConfidence:.5
       }
      );
     }catch(e){
      errors.push(
       source.js+" / "+delegate+": "+
       String(e?.message||e)
      );
     }
    }
   }
  }catch(e){
   errors.push(
    source.js+": "+String(e?.message||e)
   );
  }
 }

 throw new Error(errors.join("\n").slice(-1800));
}

start.onclick=async()=>{
 start.disabled=true;
 $("error").textContent="";

 try{
  if(!navigator.mediaDevices?.getUserMedia){
   throw Error("Нужен HTTPS и доступ к камере");
  }

  await openCamera();
  overlay.classList.add("hidden");
  switchBtn.disabled=false;

  if(!running){
   running=true;
   requestAnimationFrame(render);
  }

  try{
   detector=await loadModel();
   detail.classList.add("hidden");
   report("Покажи ладонь");
  }catch(e){
   report("Ошибка загрузки модели",e);
  }

 }catch(e){
  $("error").textContent=
   "Ошибка камеры: "+e.message;
  report("Камера недоступна",e);
 }finally{
  start.disabled=false;
 }
};

switchBtn.onclick=async()=>{
 switchBtn.disabled=true;
 facing=facing==="user"?"environment":"user";

 try{
  await openCamera();
 }catch(e){
  report("Ошибка смены камеры",e);
 }

 switchBtn.disabled=false;
};
</script>
</body>
</html>
