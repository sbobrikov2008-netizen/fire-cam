
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#08090c">
<title>Ice Cam — Frost</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#08090c;color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
video{display:none}
canvas{
 position:fixed;inset:0;width:100%;height:100%;
 object-fit:cover
}
header{
 position:fixed;top:0;left:0;right:0;
 display:flex;align-items:flex-start;
 justify-content:space-between;gap:12px;
 padding:calc(env(safe-area-inset-top) + 17px) 16px 0;
 pointer-events:none
}
.brand{
 font-size:21px;font-weight:850;
 text-shadow:0 2px 10px #000
}
.status{
 max-width:62%;font-size:12px;line-height:1.3;
 text-align:center;background:#111b;
 border:1px solid #ffffff20;padding:11px 13px;
 border-radius:15px;backdrop-filter:blur(10px)
}
.status.frozen{background:#2666dbdc}
footer{
 position:fixed;bottom:0;left:0;right:0;
 padding:0 16px calc(env(safe-area-inset-bottom) + 18px);
 display:grid;gap:10px
}
.hint{
 text-align:center;text-shadow:0 2px 8px #000;
 font-size:13px;line-height:1.4
}
button{
 width:100%;border:0;border-radius:17px;
 padding:17px 12px;font-size:16px;
 font-weight:750;background:#ff873b;
 color:#1b0b04;cursor:pointer
}
button.secondary{
 background:#ffffff37;color:#fff;
 backdrop-filter:blur(12px)
}
button:disabled{opacity:.55}
#overlay{
 position:fixed;inset:0;
 background:radial-gradient(circle at 50% 35%,#382317,#090a0d 70%);
 display:flex;align-items:center;justify-content:center;
 padding:25px;text-align:center;z-index:3
}
#overlay .panel{max-width:370px;width:100%}
h1{font-size:37px;margin:0 0 12px}
p{color:#ddd;line-height:1.5}
#error{color:#ffb4a4;font-size:13px;white-space:pre-wrap}
#notice{
 display:none;position:fixed;left:16px;right:16px;
 top:calc(env(safe-area-inset-top) + 82px);
 background:#711f1fe9;padding:12px;border-radius:12px;
 font-size:12px;white-space:pre-wrap;
 max-height:30vh;overflow:auto
}
</style>
</head>
<body>

<video id="video" autoplay muted playsinline></video>
<canvas id="screen"></canvas>

<header>
 <div class="brand">❄️ ICE CAM</div>
 <div id="status" class="status">Камера выключена</div>
</header>

<div id="notice"></div>

<footer>
 <div class="hint">
  Раскрой ладонь — по экрану расползётся иней.<br>
  Сожми кулак или убери руку — лёд растает.
 </div>
 <button id="scan" disabled>
  ✋ Включить распознавание
 </button>
 <button id="flip" class="secondary" disabled>
  ↻ Сменить камеру
 </button>
</footer>

<div id="overlay">
 <div class="panel">
  <h1>❄️ ICE CAM</h1>
  <p>Покрой камеру волшебным инеем</p>
  <button id="start">Включить камеру</button>
  <p id="error"></p>
 </div>
</div>

<script type="module">
const el=id=>document.getElementById(id);

const video=el('video');
const screen=el('screen');
const ctx=screen.getContext('2d',{alpha:false});

const status=el('status');
const scan=el('scan');
const flip=el('flip');

const modelUrl=
 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

const bases=[
 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14',
 'https://unpkg.com/@mediapipe/tasks-vision@0.10.14'
];

let detector=null;
let stream=null;
let active=false;
let recognizing=false;
let loading=false;
let facing='environment';

let frostTarget=0;
let frost=0;
let openFrames=0;
let closedFrames=0;
let lastVideoTime=-1;
let lastDetect=0;

let handX=.5;
let handY=.5;

let iceTexture=document.createElement("canvas");
let iceCtx=iceTexture.getContext("2d");
let lastFrame=0;

let width=0;
let height=0;
let ratio=1;
let offsetX=0;
let offsetY=0;

const setStatus=(message,isFrozen=false)=>{
 status.textContent=message;
 status.classList.toggle('frozen',isFrozen);
};

function showError(e){
 const n=el('notice');
 n.textContent=String(e);
 n.style.display='block';
 console.error(e);
}

function clearError(){
 el('notice').style.display='none';
}

function resize(){
 if(!video.videoWidth)return;

 const d=Math.min(devicePixelRatio||1,1.5);
 width=screen.width=Math.round(innerWidth*d);
 height=screen.height=Math.round(innerHeight*d);

 ratio=Math.max(
  width/video.videoWidth,
  height/video.videoHeight
 );

 offsetX=(width-video.videoWidth*ratio)/2;
 offsetY=(height-video.videoHeight*ratio)/2;

 frostTarget=0;
 openFrames=0;
 closedFrames=0;

 makeIceTexture();
}

addEventListener('resize',resize);

function drawCamera(){
 ctx.save();
 ctx.translate(offsetX,offsetY);

 if(facing==='user'){
  ctx.translate(video.videoWidth*ratio,0);
  ctx.scale(-1,1);
 }

 ctx.drawImage(
  video,0,0,
  video.videoWidth*ratio,
  video.videoHeight*ratio
 );

 ctx.restore();
}

function distance(a,b){
 return Math.hypot(a.x-b.x,a.y-b.y);
}

function isOpenPalm(points){
 const wrist=points[0];
 let extended=0;

 for(const [tip,pip] of [
  [8,6],[12,10],[16,14],[20,18]
 ]){
  const dTip=distance(points[tip],wrist);
  const dPip=distance(points[pip],wrist);

  if(dTip>dPip*1.16){
   extended++;
  }
 }

 return extended>=3;
}

function lerp(a,b,t){
 return a+(b-a)*t;
}

function makeIceTexture(){
 iceTexture.width=width;
 iceTexture.height=height;

 const c=iceCtx;
 const w=width;
 const h=height;

 c.clearRect(0,0,w,h);

 // Иней по краям экрана
 const edge=c.createRadialGradient(
  w*.5,h*.5,Math.min(w,h)*.12,
  w*.5,h*.5,Math.max(w,h)*.75
 );

 edge.addColorStop(0,'rgba(185,232,255,0)');
 edge.addColorStop(.54,'rgba(188,229,251,.035)');
 edge.addColorStop(.8,'rgba(197,234,255,.24)');
 edge.addColorStop(1,'rgba(227,247,255,.62)');

 c.fillStyle=edge;
 c.fillRect(0,0,w,h);

 // Генератор случайных ледяных узоров
 let seed=17391;

 const rnd=()=>{
  seed=(seed*1664525+1013904223)>>>0;
  return seed/4294967296;
 };

 function twig(x,y,angle,length,depth){
  if(depth<=0||length<2)return;

  const ex=x+Math.cos(angle)*length;
  const ey=y+Math.sin(angle)*length;

  c.strokeStyle=depth>3
   ?'rgba(218,247,255,.48)'
   :'rgba(240,252,255,.33)';

  c.lineWidth=Math.max(.65,width/900)*(depth/3);

  c.beginPath();
  c.moveTo(x,y);
  c.lineTo(ex,ey);
  c.stroke();

  if(depth>1){
   twig(
    lerp(x,ex,.6),
    lerp(y,ey,.6),
    angle+.55,
    length*.52,
    depth-1
   );

   twig(
    lerp(x,ex,.6),
    lerp(y,ey,.6),
    angle-.55,
    length*.52,
    depth-1
   );

   twig(
    ex,ey,
    angle+(rnd()-.5)*.22,
    length*.75,
    depth-1
   );
  }
 }

 // Ледяные ветви растут от краёв
 for(let i=0;i<58;i++){
  const side=i%4;
  let x,y,a;

  if(side===0){
   x=rnd()*w;
   y=0;
   a=Math.PI/2+(rnd()-.5)*1.5;
  }else if(side===1){
   x=w;
   y=rnd()*h;
   a=Math.PI+(rnd()-.5)*1.5;
  }else if(side===2){
   x=rnd()*w;
   y=h;
   a=-Math.PI/2+(rnd()-.5)*1.5;
  }else{
   x=0;
   y=rnd()*h;
   a=(rnd()-.5)*1.5;
  }

  twig(
   x,y,a,
   Math.min(w,h)*(.055+rnd()*.12),
   4
  );
 }

 // Мелкие ледяные кристаллы
 for(let i=0;i<1400;i++){
  const x=rnd()*w;
  const y=rnd()*h;

  const e=Math.max(
   Math.abs(x/w-.5)*2,
   Math.abs(y/h-.5)*2
  );

  if(rnd()>e*.85)continue;

  c.fillStyle=
   `rgba(232,250,255,${.04+rnd()*.33})`;

  c.fillRect(
   x,y,
   .5+rnd()*2,
   .5+rnd()*2
  );
 }
}

function handleDetection(result){
 const points=result?.landmarks?.[0];
 const open=!!points&&isOpenPalm(points);

 if(points){
  const p=points[9];

  handX=lerp(
   handX,
   facing==='user'?1-p.x:p.x,
   .2
  );

  handY=lerp(handY,p.y,.2);
 }

 if(open){
  openFrames++;
  closedFrames=0;
 }else{
  closedFrames++;
  openFrames=0;
 }

 if(openFrames>=3){
  frostTarget=1;
  setStatus('❄️ Ледяная магия',true);
 }

 if(closedFrames>=5){
  frostTarget=0;
  setStatus('✋ Покажи ладонь');
 }
}

function drawFrost(t){
 if(frost<.005)return;

 ctx.save();

 // Холодный голубой оттенок
 ctx.fillStyle=`rgba(96,186,235,${.09*frost})`;
 ctx.fillRect(0,0,width,height);

 ctx.globalAlpha=frost;
 ctx.drawImage(iceTexture,0,0);

 // Магическое свечение около ладони
 const x=handX*width;
 const y=handY*height;
 const r=Math.max(width,height)*(.15+.75*frost);

 const g=ctx.createRadialGradient(
  x,y,0,x,y,r
 );

 g.addColorStop(
  0,`rgba(228,250,255,${.10*frost})`
 );
 g.addColorStop(
  .35,`rgba(132,220,255,${.09*frost})`
 );
 g.addColorStop(
  1,'rgba(130,215,255,0)'
 );

 ctx.fillStyle=g;
 ctx.fillRect(0,0,width,height);

 // Мерцающие снежные частицы
 for(let i=0;i<65;i++){
  const a=i*2.399963;

  const phase=(
   i*.618+
   t*.00011*(1+i%4*.2)
  )%1;

  const rr=(.08+phase*.7)*
   Math.min(width,height);

  const px=x+Math.cos(a)*rr;
  const py=y+Math.sin(a)*rr;

  if(
   px<0||px>width||
   py<0||py>height
  )continue;

  const twinkle=
   .35+.65*Math.pow(
    Math.sin(t*.004+i*3),2
   );

  ctx.globalAlpha=
   frost*(1-phase)*twinkle*.85;

  ctx.strokeStyle='#e9fbff';
  ctx.lineWidth=Math.max(1,width/900);

  const size=(1.5+i%3)*width/420;

  ctx.beginPath();
  ctx.moveTo(px-size,py);
  ctx.lineTo(px+size,py);
  ctx.moveTo(px,py-size);
  ctx.lineTo(px,py+size);
  ctx.stroke();
 }

 ctx.restore();
}

function render(t){
 if(!active)return;

 if(video.readyState>=2){
  if(!width||!height)resize();

  drawCamera();

  if(
   recognizing&&detector&&
   video.currentTime!==lastVideoTime&&
   t-lastDetect>65
  ){
   lastVideoTime=video.currentTime;
   lastDetect=t;

   try{
    handleDetection(
     detector.detectForVideo(video,t)
    );
   }catch(e){
    showError(
     'Ошибка распознавания: '+e.message
    );
    stopRecognition();
   }
  }

  const dt=Math.min(
   60,t-(lastFrame||t)
  );

  frost=lerp(
   frost,
   frostTarget,
   1-Math.exp(
    -dt/(frostTarget?650:500)
   )
  );

  drawFrost(t);
 }

 lastFrame=t;
 requestAnimationFrame(render);
}

async function openCamera(){
 if(stream){
  stream.getTracks().forEach(
   track=>track.stop()
  );
 }

 stream=await navigator.mediaDevices.getUserMedia({
  audio:false,
  video:{
   facingMode:{ideal:facing},
   width:{ideal:1280},
   height:{ideal:720}
  }
 });

 video.srcObject=stream;
 await video.play();

 if(!video.videoWidth){
  await new Promise(resolve=>{
   video.addEventListener(
    'loadedmetadata',
    resolve,
    {once:true}
   );
  });
 }

 resize();
 lastVideoTime=-1;

 setStatus(
  recognizing
   ?'✋ Покажи ладонь'
   :'Камера работает'
 );
}

async function loadDetector(){
 const failures=[];

 for(const base of bases){
  try{
   const mod=await import(
    base+'/vision_bundle.mjs'
   );

   const files=
    await mod.FilesetResolver.forVisionTasks(
     base+'/wasm'
    );

   for(const delegate of ['GPU','CPU']){
    try{
     return await mod.HandLandmarker.createFromOptions(
      files,{
       baseOptions:{
        modelAssetPath:modelUrl,
        delegate
       },
       runningMode:'VIDEO',
       numHands:1,
       minHandDetectionConfidence:.55,
       minHandPresenceConfidence:.55,
       minTrackingConfidence:.5
      }
     );
    }catch(e){
     failures.push(
      delegate+': '+e.message
     );
    }
   }
  }catch(e){
   failures.push(
    base+': '+e.message
   );
  }
 }

 throw new Error(failures.join('\n'));
}

function stopRecognition(){
 recognizing=false;
 frostTarget=0;
 openFrames=0;
 closedFrames=0;

 scan.textContent=
  '✋ Включить распознавание';

 setStatus('Сканирование выключено');
}

async function startRecognition(){
 if(loading)return;

 loading=true;
 scan.disabled=true;
 scan.textContent='⏳ Загрузка модели...';
 clearError();

 try{
  if(!detector){
   detector=await loadDetector();
  }

  recognizing=true;
  frostTarget=0;
  openFrames=0;
  closedFrames=0;
  lastVideoTime=-1;

  scan.textContent=
   '⏹ Выключить распознавание';

  setStatus('✋ Покажи ладонь');
 }catch(e){
  showError(
   'Не удалось загрузить модель:\n'+
   e.message
  );

  scan.textContent=
   '↻ Повторить распознавание';

  setStatus('Ошибка загрузки');
 }finally{
  loading=false;
  scan.disabled=false;
 }
}

scan.onclick=()=>{
 if(loading)return;

 if(recognizing){
  stopRecognition();
 }else{
  startRecognition();
 }
};

el('start').onclick=async()=>{
 const button=el('start');
 button.disabled=true;
 el('error').textContent='';

 try{
  if(!navigator.mediaDevices?.getUserMedia){
   throw new Error(
    'Нужен HTTPS и разрешение на камеру'
   );
  }

  await openCamera();

  el('overlay').style.display='none';
  scan.disabled=false;
  flip.disabled=false;

  if(!active){
   active=true;
   requestAnimationFrame(render);
  }
 }catch(e){
  el('error').textContent=e.message;
 }finally{
  button.disabled=false;
 }
};

flip.onclick=async()=>{
 flip.disabled=true;

 const previous=facing;
 facing=facing==='environment'
  ?'user'
  :'environment';

 try{
  await openCamera();
 }catch(e){
  facing=previous;
  showError(
   'Ошибка смены камеры: '+e.message
  );
 }finally{
  flip.disabled=false;
 }
};
</script>
</body>
</html>
