
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Fire Cam 0.8</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;
 overflow:hidden;background:#000;color:white;
 font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif
}
video{display:none}
canvas{
 position:fixed;inset:0;
 width:100%;height:100%;
 pointer-events:none
}
.ui{
 position:fixed;inset:0;
 display:flex;flex-direction:column;
 justify-content:space-between;
 padding:calc(env(safe-area-inset-top) + 18px) 16px
 calc(env(safe-area-inset-bottom) + 18px);
 pointer-events:none
}
.top{
 display:flex;justify-content:space-between;
 align-items:flex-start;gap:10px
}
.brand{
 font-size:23px;font-weight:900;
 text-shadow:0 2px 8px black
}
#status{
 max-width:58%;padding:12px;
 background:#111d;border-radius:18px;
 font-size:13px;text-align:center
}
.controls{
 display:flex;flex-direction:column;gap:12px
}
button{
 pointer-events:auto;width:100%;
 padding:18px 12px;border:0;
 border-radius:18px;font-size:17px;
 font-weight:800;background:#ff792e;
 color:#190b03
}
button.secondary{
 background:#ffffff38;color:white;
 backdrop-filter:blur(12px);
 -webkit-backdrop-filter:blur(12px)
}
button:disabled{opacity:.5}
.hint{
 text-align:center;font-size:13px;
 line-height:1.5;text-shadow:0 2px 8px black
}
#debug{
 display:none;background:#171717e8;
 border-radius:12px;padding:12px;
 font-size:12px;white-space:pre-wrap;
 overflow-wrap:anywhere;max-height:150px;
 overflow:auto;pointer-events:auto
}
#debug.show{display:block}
#overlay{
 position:fixed;inset:0;z-index:10;
 display:flex;align-items:center;
 justify-content:center;text-align:center;
 background:radial-gradient(#492316,#090909 75%);
 padding:25px
}
.panel{width:100%;max-width:360px}
.panel h1{font-size:40px}
.panel p{line-height:1.5;color:#ddd}
#error{color:#ffb9a5;white-space:pre-wrap}
</style>
</head>
<body>

<video id="video" autoplay muted playsinline></video>
<canvas id="scene"></canvas>

<div class="ui">
 <div class="top">
  <div class="brand">🔥 FIRE CAM</div>
  <div id="status">Камера выключена</div>
 </div>

 <div class="controls">
  <div id="debug"></div>
  <div class="hint">
   Раскрой ладонь — появится огонь.<br>
   Разверни руку — огонь выстрелит.
  </div>
  <button id="scan" disabled>
   ✋ Включить сканирование
  </button>
  <button id="switch" class="secondary" disabled>
   ↻ Сменить камеру
  </button>
 </div>
</div>

<div id="overlay">
 <div class="panel">
  <h1>🔥 FIRE CAM</h1>
  <p>Создай огонь в своей ладони</p>
  <button id="start">Включить камеру</button>
  <p id="error"></p>
 </div>
</div>

<script type="module">
const $=id=>document.getElementById(id);
const video=$("video");
const canvas=$("scene");
const ctx=canvas.getContext("2d",{alpha:false});
const status=$("status");
const scanBtn=$("scan");
const switchBtn=$("switch");
const debug=$("debug");

const VERSION="0.10.14";
const BASES=[
 "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@"+VERSION,
 "https://unpkg.com/@mediapipe/tasks-vision@"+VERSION
];
const MODEL="https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

let detector=null;
let stream=null;
let running=false;
let scanning=false;
let loading=false;
let facing="environment";

let W=0,H=0,scale=1,dx=0,dy=0;
let hand=null;
let palmOpen=false;
let firePower=0;
let lastSeen=0;
let lastVideoTime=-1;
let lastDetection=0;
let lastTick=0;

let shot=null;
let shotArmed=true;
let turnStarted=0;
let lastOrientation="unknown";

const fireCanvas=document.createElement("canvas");
const fc=fireCanvas.getContext("2d");

function lerp(a,b,t){
 return a+(b-a)*t;
}
function dist(a,b){
 return Math.hypot(a.x-b.x,a.y-b.y);
}
function clamp(x,a,b){
 return Math.max(a,Math.min(b,x));
}
function setStatus(s){
 status.textContent=s;
}
function error(s){
 debug.textContent=s;
 debug.classList.add("show");
 console.error(s);
}
function clearError(){
 debug.textContent="";
 debug.classList.remove("show");
}

function resize(){
 if(!video.videoWidth)return;
 const d=Math.min(devicePixelRatio||1,1.5);
 W=canvas.width=Math.round(innerWidth*d);
 H=canvas.height=Math.round(innerHeight*d);
 fireCanvas.width=W;
 fireCanvas.height=H;
 scale=Math.max(
  W/video.videoWidth,
  H/video.videoHeight
 );
 dx=(W-video.videoWidth*scale)/2;
 dy=(H-video.videoHeight*scale)/2;
}
addEventListener("resize",resize);

function drawVideo(){
 ctx.save();
 ctx.translate(dx,dy);
 if(facing==="user"){
  ctx.translate(video.videoWidth*scale,0);
  ctx.scale(-1,1);
 }
 ctx.drawImage(
  video,0,0,
  video.videoWidth*scale,
  video.videoHeight*scale
 );
 ctx.restore();
}

function point(p){
 return {
  x:dx+(facing==="user"?1-p.x:p.x)
   *video.videoWidth*scale,
  y:dy+p.y*video.videoHeight*scale,
  z:p.z
 };
}

// Palm/back orientation using the hand plane.
function orientation(raw){
 const a=raw[5],b=raw[17],c=raw[0];
 const ux=b.x-a.x,uy=b.y-a.y;
 const vx=c.x-a.x,vy=c.y-a.y;
 const cross=ux*vy-uy*vx;

 // Camera-facing sign may require calibration.
 const back=facing==="user"?cross<0:cross>0;
 const strength=Math.abs(cross);

 if(strength<0.012)return "side";
 return back?"back":"front";
}

function updateHand(result,time){
 const raw=result?.landmarks?.[0];

 if(!raw){
  if(time-lastSeen>300){
   palmOpen=false;
   hand=null;
   turnStarted=0;
  }
  return;
 }

 lastSeen=time;
 const p=raw.map(point);
 const span=dist(p[5],p[17]);

 const center={
  x:(p[0].x+p[5].x+p[9].x+p[17].x)/4,
  y:(p[0].y+p[5].y+p[9].y+p[17].y)/4
 };

 let extended=0;
 for(const [tip,joint] of [
  [8,6],[12,10],[16,14],[20,18]
 ]){
  if(dist(p[tip],p[0])>
     dist(p[joint],p[0])*1.13){
   extended++;
  }
 }
 palmOpen=extended>=3;

 const side=orientation(raw);

 // Move the ball above the hand, toward the fingers.
 const dirX=p[9].x-p[0].x;
 const dirY=p[9].y-p[0].y;
 const len=Math.hypot(dirX,dirY)||1;
 const ux=dirX/len,uy=dirY/len;

 const target={
  x:center.x+ux*span*.28,
  y:center.y+uy*span*.28,
  r:clamp(span*.72,22,W*.19),
  side,
  span
 };

 if(!hand){
  hand=target;
 }else{
  hand.x=lerp(hand.x,target.x,.32);
  hand.y=lerp(hand.y,target.y,.32);
  hand.r=lerp(hand.r,target.r,.25);
  hand.span=span;
  hand.side=side;
 }

 handleGesture(time);
}

function handleGesture(time){
 if(!hand||!palmOpen){
  turnStarted=0;
  lastOrientation="unknown";
  return;
 }

 if(hand.side==="front"){
  shotArmed=true;
  turnStarted=0;
  lastOrientation="front";
 }else if(hand.side==="side"){
  turnStarted=0;
  lastOrientation="side";
 }else if(hand.side==="back"){
  if(shotArmed){
   if(!turnStarted)turnStarted=time;
   if(time-turnStarted>180){
    shoot(time);
    shotArmed=false;
    turnStarted=0;
   }
  }
  lastOrientation="back";
 }
}

function shoot(time){
 if(!hand)return;

 shot={
  x:hand.x,
  y:hand.y,
  r:hand.r,
  start:time,
  duration:950
 };
 setStatus("🔥 Огненный выстрел!");
}

// Fireball with animated flame tongues.
function drawFireball(c,x,y,r,t,alpha=1){
 if(r<=0||alpha<=0)return;

 c.save();
 c.globalAlpha=alpha;
 c.globalCompositeOperation="screen";

 const glow=c.createRadialGradient(
  x,y,0,x,y,r*2.1
 );
 glow.addColorStop(0,"rgba(255,150,20,.42)");
 glow.addColorStop(.35,"rgba(255,95,0,.22)");
 glow.addColorStop(1,"rgba(255,40,0,0)");

 c.fillStyle=glow;
 c.beginPath();
 c.arc(x,y,r*2.1,0,Math.PI*2);
 c.fill();

 // Irregular animated flame boundary.
 for(let layer=0;layer<3;layer++){
  c.beginPath();
  const count=64;
  for(let i=0;i<=count;i++){
   const a=i/count*Math.PI*2;
   const wave=
    Math.sin(a*7-t*5+layer)*.12+
    Math.sin(a*13+t*7+layer*2)*.07;
   const flame=
    Math.max(0,-Math.sin(a))*
    (.12+.1*Math.sin(t*6+a*9));
   const radius=r*(
    1.02+wave+flame+layer*.08
   );
   const px=x+Math.cos(a)*radius;
   const py=y+Math.sin(a)*radius;
   if(i===0)c.moveTo(px,py);
   else c.lineTo(px,py);
  }
  c.closePath();

  const g=c.createRadialGradient(
   x,y,r*.08,x,y,r*1.5
  );
  g.addColorStop(0,"rgba(255,210,80,.95)");
  g.addColorStop(.38,"rgba(255,115,0,.8)");
  g.addColorStop(.75,"rgba(255,50,0,.35)");
  g.addColorStop(1,"rgba(255,30,0,0)");
  c.fillStyle=g;
  c.globalAlpha=alpha*(.8-layer*.18);
  c.fill();
 }

 c.globalAlpha=alpha;

 const core=c.createRadialGradient(
  x-r*.16,y-r*.18,r*.04,
  x,y,r*.94
 );
 core.addColorStop(0,"rgba(255,250,185,.95)");
 core.addColorStop(.25,"rgba(255,204,65,.95)");
 core.addColorStop(.65,"rgba(255,115,0,.85)");
 core.addColorStop(1,"rgba(255,50,0,0)");

 c.fillStyle=core;
 c.beginPath();
 c.arc(x,y,r*.94,0,Math.PI*2);
 c.fill();

 // Small drifting embers, not a ring of dots.
 for(let i=0;i<18;i++){
  const phase=(i*.618+t*(.3+i%4*.04))%1;
  const angle=i*2.399;
  const px=x+Math.cos(angle)*r*.85+
   Math.sin(t*2+i)*r*.1;
  const py=y-r*(.25+phase*1.6);
  const size=r*(.012+.035*(1-phase));

  c.globalAlpha=alpha*(1-phase)*.65;
  c.fillStyle=i%3===0?"#ffe39a":"#ff751b";
  c.beginPath();
  c.arc(px,py,size,0,Math.PI*2);
  c.fill();
 }

 c.restore();
}

function renderFire(time){
 if(!hand||firePower<.015)return;

 const t=time/1000;
 const bob=Math.sin(t*3.1)*hand.r*.07;
 const x=hand.x;
 const y=hand.y+bob;
 const r=hand.r*firePower;

 // Keep the sphere round when the hand turns sideways.
 drawFireball(ctx,x,y,r,t,firePower);
}

function renderShot(time){
 if(!shot)return;

 const progress=(time-shot.start)/shot.duration;
 if(progress>=1){
  shot=null;
  return;
 }

 const p=clamp(progress,0,1);
 const eased=1-Math.pow(1-p,2.2);

 // Simulated movement away from the camera.
 const x=shot.x;
 const y=shot.y-shot.r*.45*eased;
 const r=shot.r*(1-.83*eased);
 const alpha=Math.pow(1-p,.65);

 drawFireball(ctx,x,y,r,time/1000,alpha);
}

function render(time){
 if(!running)return;

 if(video.readyState>=2){
  if(!W||!H)resize();
  ctx.clearRect(0,0,W,H);
  drawVideo();

  if(scanning&&detector&&
     video.currentTime!==lastVideoTime&&
     time-lastDetection>=65){

   lastVideoTime=video.currentTime;
   lastDetection=time;

   try{
    const result=detector.detectForVideo(video,time);
    updateHand(result,time);

    if(!result.landmarks?.length){
     setStatus("✋ Покажи руку");
    }else if(!palmOpen){
     setStatus("✊ Раскрой ладонь");
    }else if(hand?.side==="back"){
     setStatus(shotArmed?
      "🔥 Разворот руки":"🔥 Выстрел выполнен");
    }else if(hand?.side==="side"){
     setStatus("🔥 Ладонь сбоку");
    }else{
     setStatus("🔥 Ладонь открыта");
    }
   }catch(e){
    error("Ошибка распознавания: "+e.message);
    stopScanning();
   }
  }

  if(scanning){
   if(time-lastSeen>350)palmOpen=false;

   const dt=Math.min(50,time-(lastTick||time));
   const smooth=1-Math.exp(-dt/120);

   const visible=
    hand&&palmOpen&&shotArmed;

   firePower=lerp(
    firePower,
    visible?1:0,
    smooth
   );

   renderFire(time);
   renderShot(time);
  }else{
   firePower=0;
  }
 }

 lastTick=time;
 requestAnimationFrame(render);
}

async function openCamera(){
 if(stream){
  stream.getTracks().forEach(t=>t.stop());
 }
 stream=null;

 const s=await navigator.mediaDevices.getUserMedia({
  audio:false,
  video:{
   facingMode:{ideal:facing},
   width:{ideal:1280},
   height:{ideal:720}
  }
 });

 stream=s;
 video.srcObject=s;
 await video.play();

 if(!video.videoWidth){
  await new Promise(resolve=>{
   video.addEventListener(
    "loadedmetadata",resolve,{once:true}
   );
  });
 }

 resize();
 hand=null;
 palmOpen=false;
 firePower=0;
 shot=null;
 shotArmed=true;
 turnStarted=0;
 lastVideoTime=-1;
 lastSeen=0;
}

async function createDetector(){
 const errors=[];

 for(const base of BASES){
  try{
   setStatus("Загрузка MediaPipe...");
   const mod=await import(base+"/vision_bundle.mjs");
   const vision=await mod.FilesetResolver.forVisionTasks(
    base+"/wasm"
   );

   for(const delegate of ["GPU","CPU"]){
    try{
     setStatus("Запуск распознавания...");
     return await mod.HandLandmarker.createFromOptions(
      vision,{
       baseOptions:{
        modelAssetPath:MODEL,
        delegate
       },
       runningMode:"VIDEO",
       numHands:1,
       minHandDetectionConfidence:.55,
       minHandPresenceConfidence:.55,
       minTrackingConfidence:.5
      }
     );
    }catch(e){
     errors.push(delegate+": "+e.message);
    }
   }
  }catch(e){
   errors.push(base+": "+e.message);
  }
 }

 throw Error(errors.join("\n"));
}

function stopScanning(){
 scanning=false;
 palmOpen=false;
 hand=null;
 firePower=0;
 shot=null;
 shotArmed=true;
 turnStarted=0;
 scanBtn.textContent="✋ Включить сканирование";
 setStatus("Сканирование выключено");
}

async function startScanning(){
 if(loading)return;
 loading=true;
 scanBtn.disabled=true;
 scanBtn.textContent="⏳ Загрузка...";
 clearError();

 try{
  if(!detector){
   detector=await createDetector();
  }
  scanning=true;
  shotArmed=true;
  lastSeen=0;
  lastVideoTime=-1;
  scanBtn.textContent="⏹ Выключить сканирование";
  setStatus("✋ Покажи ладонь");
 }catch(e){
  scanning=false;
  error("Ошибка модели:\n"+e.message);
  setStatus("Ошибка сканирования");
  scanBtn.textContent="↻ Повторить сканирование";
 }finally{
  loading=false;
  scanBtn.disabled=false;
 }
}

scanBtn.onclick=()=>{
 if(loading)return;
 if(scanning)stopScanning();
 else startScanning();
};

$("start").onclick=async()=>{
 const btn=$("start");
 btn.disabled=true;
 $("error").textContent="";

 try{
  if(!navigator.mediaDevices?.getUserMedia){
   throw Error("Нужен HTTPS и доступ к камере");
  }

  await openCamera();
  $("overlay").style.display="none";
  scanBtn.disabled=false;
  switchBtn.disabled=false;

  if(!running){
   running=true;
   requestAnimationFrame(render);
  }
  setStatus("Камера работает");
 }catch(e){
  $("error").textContent=e.message;
 }finally{
  btn.disabled=false;
 }
};

switchBtn.onclick=async()=>{
 switchBtn.disabled=true;
 const previous=facing;
 facing=facing==="user"?"environment":"user";

 try{
  await openCamera();
  setStatus(scanning?
   "✋ Покажи ладонь":"Камера работает");
 }catch(e){
  facing=previous;
  error("Ошибка камеры: "+e.message);
 }
 switchBtn.disabled=false;
};
</script>
</body>
</html>
