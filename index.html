
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07121f">
<title>Ice Cam 1.1</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;
 overflow:hidden;background:#030914;color:white;
 font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif
}
video{display:none}
canvas{
 position:fixed;inset:0;width:100%;height:100%;
 pointer-events:none
}
.ui{
 position:fixed;inset:0;
 display:flex;flex-direction:column;
 justify-content:space-between;
 padding:calc(env(safe-area-inset-top) + 18px) 16px
 calc(env(safe-area-inset-bottom) + 18px);
 pointer-events:none
}
.top{
 display:flex;justify-content:space-between;
 align-items:flex-start;gap:10px
}
.brand{
 font-size:23px;font-weight:900;
 text-shadow:0 2px 8px #000
}
#status{
 max-width:60%;padding:12px;
 border-radius:16px;background:#081a2acc;
 border:1px solid #bdefff33;
 font-size:12px;text-align:center;
 backdrop-filter:blur(10px)
}
.controls{display:grid;gap:11px}
.hint{
 text-align:center;font-size:13px;
 line-height:1.5;text-shadow:0 2px 8px #000
}
button{
 pointer-events:auto;width:100%;
 padding:17px;border:0;border-radius:17px;
 font-size:16px;font-weight:800;
 background:#9be8ff;color:#092033
}
button.secondary{
 background:#ffffff38;color:white;
 backdrop-filter:blur(12px)
}
button:disabled{opacity:.5}
#overlay{
 position:fixed;inset:0;z-index:10;
 display:flex;align-items:center;
 justify-content:center;text-align:center;
 background:radial-gradient(#173e5b,#030914 75%);
 padding:25px
}
.panel{width:100%;max-width:360px}
.panel h1{font-size:40px}
.panel p{line-height:1.5;color:#d6e7f2}
#error{
 color:#ffb9a5;white-space:pre-wrap;
 font-size:13px
}
#debug{
 display:none;padding:12px;
 background:#162a3de8;border-radius:12px;
 font-size:12px;white-space:pre-wrap;
 max-height:140px;overflow:auto;
 pointer-events:auto
}
#debug.show{display:block}
</style>
</head>
<body>

<video id="video" autoplay muted playsinline></video>
<canvas id="scene"></canvas>

<div class="ui">
 <div class="top">
  <div class="brand">❄️ ICE CAM</div>
  <div id="status">Камера выключена</div>
 </div>

 <div class="controls">
  <div id="debug"></div>
  <div class="hint">
   ✋ Раскрой ладонь — заморозь экран.<br>
   ❄️ Опусти пальцы вниз — создай снегопад.
  </div>
  <button id="scan" disabled>
   ✋ Включить магию
  </button>
  <button id="switch" class="secondary" disabled>
   ↻ Сменить камеру
  </button>
 </div>
</div>

<div id="overlay">
 <div class="panel">
  <h1>❄️ ICE CAM</h1>
  <p>Управляй ледяной магией своей рукой</p>
  <button id="start">Включить камеру</button>
  <p id="error"></p>
 </div>
</div>

<script type="module">

const $=id=>document.getElementById(id);

const video=$("video");
const canvas=$("scene");
const ctx=canvas.getContext("2d",{alpha:false});
const status=$("status");
const scanBtn=$("scan");
const switchBtn=$("switch");
const debug=$("debug");

const VERSION="0.10.14";

const BASES=[
 "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@"+VERSION,
 "https://unpkg.com/@mediapipe/tasks-vision@"+VERSION
];

const MODEL=
 "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

let detector=null;
let stream=null;
let running=false;
let scanning=false;
let loading=false;
let facing="environment";

let W=0,H=0;
let scale=1,dx=0,dy=0;

let frost=0;
let frostTarget=0;
let snowing=false;

let handX=0;
let handY=0;
let handSize=80;

let openFrames=0;
let closedFrames=0;
let downFrames=0;
let upFrames=0;

let lastSeen=0;
let lastVideoTime=-1;
let lastDetection=0;
let lastTick=0;

const snowflakes=[];
const MAX_SNOW=260;

const frostCanvas=document.createElement("canvas");
const frostCtx=frostCanvas.getContext("2d");

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function setStatus(s){
 status.textContent=s;
}

function showError(s){
 debug.textContent=s;
 debug.classList.add("show");
 console.error(s);
}

function clearError(){
 debug.textContent="";
 debug.classList.remove("show");
}

function resize(){
 if(!video.videoWidth)return;

 const d=Math.min(devicePixelRatio||1,1.5);

 W=canvas.width=Math.round(innerWidth*d);
 H=canvas.height=Math.round(innerHeight*d);

 scale=Math.max(
  W/video.videoWidth,
  H/video.videoHeight
 );

 dx=(W-video.videoWidth*scale)/2;
 dy=(H-video.videoHeight*scale)/2;

 frostCanvas.width=W;
 frostCanvas.height=H;

 generateFrost();
}

addEventListener("resize",resize);

function drawVideo(){
 ctx.save();
 ctx.translate(dx,dy);

 if(facing==="user"){
  ctx.translate(video.videoWidth*scale,0);
  ctx.scale(-1,1);
 }

 ctx.drawImage(
  video,0,0,
  video.videoWidth*scale,
  video.videoHeight*scale
 );

 ctx.restore();
}

function point(p){
 return {
  x:dx+(facing==="user"?1-p.x:p.x)
   *video.videoWidth*scale,
  y:dy+p.y*video.videoHeight*scale
 };
}

function isOpenPalm(p){
 const wrist=p[0];
 let extended=0;

 for(const [tip,joint] of [
  [8,6],[12,10],[16,14],[20,18]
 ]){
  if(dist(p[tip],wrist)>
     dist(p[joint],wrist)*1.14){
   extended++;
  }
 }

 return extended>=3;
}

// Detect fingers pointing down on screen.
// This is a 2D gesture, not true floor orientation.
function fingersPointDown(p){
 const wrist=p[0];
 const middle=p[12];
 const base=p[9];

 const vx=middle.x-wrist.x;
 const vy=middle.y-wrist.y;

 const len=Math.hypot(vx,vy)||1;

 const vertical=vy/len;

 // Middle fingertip must point downward.
 const pointingDown=vertical>.62;

 // Finger must extend beyond its base.
 const extended=
  dist(middle,wrist)>
  dist(base,wrist)*1.35;

 return pointingDown&&extended;
}

function handleDetection(result,time){
 const raw=result?.landmarks?.[0];

 if(!raw){
  if(time-lastSeen>280){
   closedFrames++;
   openFrames=0;
   downFrames=0;

   if(closedFrames>=5){
    frostTarget=0;
    snowing=false;
    setStatus("✋ Покажи ладонь");
   }
  }
  return;
 }

 lastSeen=time;

 const p=raw.map(point);
 const open=isOpenPalm(p);
 const down=open&&fingersPointDown(p);

 const palm={
  x:(p[0].x+p[5].x+p[9].x+p[17].x)/4,
  y:(p[0].y+p[5].y+p[9].y+p[17].y)/4
 };

 const size=dist(p[5],p[17]);

 handX=lerp(handX||palm.x,palm.x,.3);
 handY=lerp(handY||palm.y,palm.y,.3);
 handSize=lerp(handSize,size,.2);

 if(open){
  openFrames++;
  closedFrames=0;

  if(openFrames>=3){
   frostTarget=1;
  }
 }else{
  closedFrames++;
  openFrames=0;
  downFrames=0;

  if(closedFrames>=5){
   frostTarget=0;
   snowing=false;
  }
 }

 if(down){
  downFrames++;
  upFrames=0;

  if(downFrames>=3){
   snowing=true;
  }
 }else{
  upFrames++;
  downFrames=0;

  if(upFrames>=3){
   snowing=false;
  }
 }

 if(snowing){
  setStatus("❄️ СНЕЖНАЯ МАГИЯ");
 }else if(frostTarget){
  setStatus("🧊 Экран замерзает");
 }else{
  setStatus("✋ Раскрой ладонь");
 }
}

// Deterministic random generator for texture.
let seed=14729;

function rnd(){
 seed=(seed*1664525+1013904223)>>>0;
 return seed/4294967296;
}

function generateFrost(){
 const c=frostCtx;
 const w=W,h=H;

 c.clearRect(0,0,w,h);

 seed=14729;

 // Stronger blue-white frost around edges.
 const edge=c.createRadialGradient(
  w*.5,h*.5,Math.min(w,h)*.08,
  w*.5,h*.5,Math.max(w,h)*.75
 );

 edge.addColorStop(0,"rgba(170,228,255,0)");
 edge.addColorStop(.32,"rgba(185,233,255,.03)");
 edge.addColorStop(.58,"rgba(200,239,255,.14)");
 edge.addColorStop(.78,"rgba(218,245,255,.4)");
 edge.addColorStop(1,"rgba(238,251,255,.88)");

 c.fillStyle=edge;
 c.fillRect(0,0,w,h);

 // Fractal ice branches.
 function branch(x,y,a,len,depth){
  if(depth<=0||len<2)return;

  const nx=x+Math.cos(a)*len;
  const ny=y+Math.sin(a)*len;

  c.strokeStyle=depth>3
   ?"rgba(245,254,255,.65)"
   :"rgba(212,244,255,.45)";

  c.lineWidth=Math.max(.7,w/900)*depth/3;

  c.beginPath();
  c.moveTo(x,y);
  c.lineTo(nx,ny);
  c.stroke();

  if(depth>1){
   const mx=lerp(x,nx,.58);
   const my=lerp(y,ny,.58);

   branch(mx,my,a+.57,len*.53,depth-1);
   branch(mx,my,a-.57,len*.53,depth-1);
   branch(nx,ny,a+(rnd()-.5)*.2,
    len*.78,depth-1);
  }
 }

 for(let i=0;i<95;i++){
  const side=i%4;
  let x,y,a;

  if(side===0){
   x=rnd()*w;y=0;
   a=Math.PI/2+(rnd()-.5)*1.4;
  }else if(side===1){
   x=w;y=rnd()*h;
   a=Math.PI+(rnd()-.5)*1.4;
  }else if(side===2){
   x=rnd()*w;y=h;
   a=-Math.PI/2+(rnd()-.5)*1.4;
  }else{
   x=0;y=rnd()*h;
   a=(rnd()-.5)*1.4;
  }

  branch(
   x,y,a,
   Math.min(w,h)*(.08+rnd()*.17),
   5
  );
 }

 // Tiny ice crystals.
 for(let i=0;i<2600;i++){
  const x=rnd()*w;
  const y=rnd()*h;

  const edgeStrength=Math.max(
   Math.abs(x/w-.5)*2,
   Math.abs(y/h-.5)*2
  );

  if(rnd()>edgeStrength*.9)continue;

  const a=.08+rnd()*.45;
  c.fillStyle=`rgba(240,252,255,${a})`;

  const s=.5+rnd()*2.6;
  c.fillRect(x,y,s,s);
 }
}

function drawFrost(time){
 if(frost<.003)return;

 ctx.save();

 // Increasing cold tint.
 ctx.fillStyle=
  `rgba(75,160,225,${frost*.16})`;

 ctx.fillRect(0,0,W,H);

 // First layer of frost.
 ctx.globalAlpha=clamp(frost*1.3,0,1);
 ctx.drawImage(frostCanvas,0,0);

 // Second layer appears later,
 // making the screen substantially icier.
 const heavy=clamp((frost-.48)/.52,0,1);

 if(heavy>0){
  ctx.globalAlpha=heavy*.46;
  ctx.drawImage(frostCanvas,0,0);

  ctx.globalAlpha=heavy*.13;
  ctx.fillStyle="#c6f1ff";
  ctx.fillRect(0,0,W,H);
 }

 // Cold glow.
 ctx.globalAlpha=1;

 const glow=ctx.createRadialGradient(
  handX,handY,0,
  handX,handY,
  Math.max(W,H)*.45
 );

 glow.addColorStop(
  0,`rgba(225,249,255,${frost*.12})`
 );
 glow.addColorStop(
  .35,`rgba(116,207,255,${frost*.1})`
 );
 glow.addColorStop(1,"rgba(116,207,255,0)");

 ctx.fillStyle=glow;
 ctx.fillRect(0,0,W,H);

 // Glittering ice crystals.
 for(let i=0;i<85;i++){
  const a=i*2.399963;
  const q=(i*.618+time*.000065)%1;

  const rr=(.08+q*.75)*Math.min(W,H);
  const x=handX+Math.cos(a)*rr;
  const y=handY+Math.sin(a)*rr;

  if(x<0||x>W||y<0||y>H)continue;

  const sparkle=
   .35+.65*Math.sin(time*.004+i*3)**2;

  ctx.globalAlpha=
   frost*(1-q)*sparkle*.85;

  ctx.strokeStyle="#effcff";
  ctx.lineWidth=Math.max(1,W/900);

  const s=(1.5+i%3)*W/420;

  ctx.beginPath();
  ctx.moveTo(x-s,y);
  ctx.lineTo(x+s,y);
  ctx.moveTo(x,y-s);
  ctx.lineTo(x,y+s);
  ctx.stroke();
 }

 ctx.restore();
}

// Snow particle physics.
function spawnSnow(){
 if(snowflakes.length>=MAX_SNOW)return;

 const amount=4+Math.floor(Math.random()*4);

 for(let i=0;i<amount;i++){
  if(snowflakes.length>=MAX_SNOW)break;

  const radius=1.5+Math.random()*3.8;
  const spread=handSize*.65;

  snowflakes.push({
   x:handX+(Math.random()-.5)*spread,
   y:handY+handSize*.12,
   vx:(Math.random()-.5)*1.8,
   vy:.5+Math.random()*1.6,
   gravity:.025+Math.random()*.045,
   radius,
   opacity:.65+Math.random()*.35,
   angle:Math.random()*Math.PI*2,
   spin:(Math.random()-.5)*.035,
   phase:Math.random()*Math.PI*2,
   age:0,
   life:150+Math.random()*110
  });
 }
}

function drawSnowflake(p){
 ctx.save();
 ctx.translate(p.x,p.y);
 ctx.rotate(p.angle);
 ctx.globalAlpha=p.opacity*
  clamp((p.life-p.age)/35,0,1);

 ctx.strokeStyle="#e8faff";
 ctx.lineWidth=Math.max(.8,p.radius*.19);
 ctx.lineCap="round";

 const r=p.radius*2.3;

 for(let i=0;i<3;i++){
  const a=i*Math.PI/3;
  const x=Math.cos(a)*r;
  const y=Math.sin(a)*r;

  ctx.beginPath();
  ctx.moveTo(-x,-y);
  ctx.lineTo(x,y);
  ctx.stroke();
 }

 ctx.restore();
}

function updateSnow(dt,time){
 const factor=dt/16.67;

 if(snowing){
  spawnSnow();
 }

 for(let i=snowflakes.length-1;i>=0;i--){
  const p=snowflakes[i];

  p.age+=factor;
  p.vy+=p.gravity*factor;
  p.x+=(
   p.vx+Math.sin(time*.002+p.phase)*.55
  )*factor;
  p.y+=p.vy*factor;
  p.angle+=p.spin*factor;

  if(
   p.y>H+20||
   p.x< -30||
   p.x>W+30||
   p.age>=p.life
  ){
   snowflakes.splice(i,1);
   continue;
  }

  drawSnowflake(p);
 }
}

function render(time){
 if(!running)return;

 if(video.readyState>=2){
  if(!W||!H)resize();

  drawVideo();

  if(
   scanning&&detector&&
   video.currentTime!==lastVideoTime&&
   time-lastDetection>=65
  ){
   lastVideoTime=video.currentTime;
   lastDetection=time;

   try{
    const result=
     detector.detectForVideo(video,time);

    handleDetection(result,time);
   }catch(e){
    showError(
     "Ошибка распознавания: "+e.message
    );
    stopScanning();
   }
  }

  const dt=Math.min(
   60,time-(lastTick||time)
  );

  // Freeze takes about 5 seconds to build up.
  // Thawing is faster but still smooth.
  const duration=frostTarget?5000:1800;

  const step=dt/duration;

  if(frostTarget>frost){
   frost=Math.min(1,frost+step);
  }else if(frostTarget<frost){
   frost=Math.max(0,frost-step);
  }

  drawFrost(time);
  updateSnow(dt,time);
 }

 lastTick=time;
 requestAnimationFrame(render);
}

async function openCamera(){
 if(stream){
  stream.getTracks().forEach(
   track=>track.stop()
  );
 }

 stream=await navigator.mediaDevices.getUserMedia({
  audio:false,
  video:{
   facingMode:{ideal:facing},
   width:{ideal:1280},
   height:{ideal:720}
  }
 });

 video.srcObject=stream;
 await video.play();

 if(!video.videoWidth){
  await new Promise(resolve=>{
   video.addEventListener(
    "loadedmetadata",resolve,{once:true}
   );
  });
 }

 resize();

 lastVideoTime=-1;
 lastSeen=0;

 frost=0;
 frostTarget=0;
 snowing=false;

 snowflakes.length=0;
}

async function createDetector(){
 const errors=[];

 for(const base of BASES){
  try{
   setStatus("Загрузка модели...");

   const mod=await import(
    base+"/vision_bundle.mjs"
   );

   const files=
    await mod.FilesetResolver.forVisionTasks(
     base+"/wasm"
    );

   for(const delegate of ["GPU","CPU"]){
    try{
     return await mod.HandLandmarker.createFromOptions(
      files,{
       baseOptions:{
        modelAssetPath:MODEL,
        delegate
       },
       runningMode:"VIDEO",
       numHands:1,
       minHandDetectionConfidence:.55,
       minHandPresenceConfidence:.55,
       minTrackingConfidence:.5
      }
     );
    }catch(e){
     errors.push(delegate+": "+e.message);
    }
   }
  }catch(e){
   errors.push(base+": "+e.message);
  }
 }

 throw Error(errors.join("\n"));
}

function stopScanning(){
 scanning=false;
 frostTarget=0;
 snowing=false;

 openFrames=0;
 closedFrames=0;
 downFrames=0;
 upFrames=0;

 scanBtn.textContent="✋ Включить магию";
 setStatus("Магия выключена");
}

async function startScanning(){
 if(loading)return;

 loading=true;
 scanBtn.disabled=true;
 scanBtn.textContent="⏳ Загрузка...";
 clearError();

 try{
  if(!detector){
   detector=await createDetector();
  }

  scanning=true;

  openFrames=0;
  closedFrames=0;
  downFrames=0;
  upFrames=0;

  lastVideoTime=-1;

  scanBtn.textContent="⏹ Выключить магию";
  setStatus("✋ Покажи ладонь");
 }catch(e){
  scanning=false;

  showError(
   "Ошибка загрузки модели:\n"+e.message
  );

  setStatus("Ошибка сканирования");
  scanBtn.textContent="↻ Повторить";
 }finally{
  loading=false;
  scanBtn.disabled=false;
 }
}

scanBtn.onclick=()=>{
 if(loading)return;

 if(scanning){
  stopScanning();
 }else{
  startScanning();
 }
};

$("start").onclick=async()=>{
 const btn=$("start");
 btn.disabled=true;
 $("error").textContent="";

 try{
  if(!navigator.mediaDevices?.getUserMedia){
   throw Error(
    "Нужен HTTPS и доступ к камере"
   );
  }

  await openCamera();

  $("overlay").style.display="none";

  scanBtn.disabled=false;
  switchBtn.disabled=false;

  if(!running){
   running=true;
   requestAnimationFrame(render);
  }

  setStatus("Камера работает");
 }catch(e){
  $("error").textContent=e.message;
 }finally{
  btn.disabled=false;
 }
};

switchBtn.onclick=async()=>{
 switchBtn.disabled=true;

 const previous=facing;

 facing=facing==="user"
  ?"environment"
  :"user";

 try{
  await openCamera();
  setStatus(
   scanning
    ?"✋ Покажи ладонь"
    :"Камера работает"
  );
 }catch(e){
  facing=previous;
  showError(
   "Ошибка смены камеры: "+e.message
  );
 }

 switchBtn.disabled=false;
};

</script>
</body>
</html>
