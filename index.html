
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fire Cam</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;
 overflow:hidden;background:#08090d;
 color:white;font-family:-apple-system,Arial
}
video{display:none}
canvas{
 position:fixed;inset:0;
 width:100%;height:100%
}
.ui{
 position:fixed;inset:0;
 pointer-events:none;
 display:flex;flex-direction:column;
 justify-content:space-between;
 padding:calc(env(safe-area-inset-top) + 20px) 18px
 calc(env(safe-area-inset-bottom) + 25px);
}
.top{display:flex;justify-content:space-between;gap:12px}
.brand{font-size:20px;font-weight:800}
#status{
 font-size:12px;background:#161616bb;
 border-radius:15px;padding:10px;
 max-width:65%;text-align:right
}
.bottom{display:flex;justify-content:space-between;align-items:end;gap:12px}
.hint{font-size:13px;max-width:60%;line-height:1.5}
button{
 pointer-events:auto;border:0;
 border-radius:16px;padding:15px;
 background:#ff792e;color:#180b04;
 font-size:15px;font-weight:700
}
#overlay{
 position:fixed;inset:0;z-index:10;
 background:radial-gradient(#422017,#08090d 75%);
 display:flex;align-items:center;
 justify-content:center;padding:25px;
 text-align:center
}
.panel{max-width:380px}
.panel h1{font-size:35px}
.panel p{line-height:1.6;color:#ddd}
#error{color:#ffb3a3;font-size:13px;white-space:pre-wrap}
.hidden{display:none!important}
</style>
</head>
<body>

<video id="video" autoplay muted playsinline></video>
<canvas id="canvas"></canvas>

<div class="ui">
 <div class="top">
  <div class="brand">🔥 FIRE CAM</div>
  <div id="status">Камера выключена</div>
 </div>
 <div class="bottom">
  <div class="hint">
   Раскрой ладонь — появится огонь.
   Сожми кулак — огонь погаснет.
  </div>
  <button id="switch" disabled>↻ Камера</button>
 </div>
</div>

<div id="overlay">
 <div class="panel">
  <h1>🔥 Fire Cam</h1>
  <p>
   Реалистичный огненный шар над ладонью.
   Управление жестами.
  </p>
  <button id="start">Включить камеру</button>
  <p id="error"></p>
 </div>
</div>

<script type="module">
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const status=document.getElementById("status");
const overlay=document.getElementById("overlay");
const start=document.getElementById("start");
const switchBtn=document.getElementById("switch");
const error=document.getElementById("error");

let detector=null;
let stream=null;
let facing="user";
let running=false;
let hand=null;
let open=false;
let strength=0;
let lastSeen=0;
let lastVideoTime=-1;
let width=0,height=0;
let scale=1,dx=0,dy=0;

const mask=document.createElement("canvas");
const maskCtx=mask.getContext("2d");
const foreground=document.createElement("canvas");
const fgCtx=foreground.getContext("2d");

function resize(){
 const d=Math.min(devicePixelRatio||1,1.5);
 width=canvas.width=Math.round(innerWidth*d);
 height=canvas.height=Math.round(innerHeight*d);
 mask.width=foreground.width=width;
 mask.height=foreground.height=height;
 scale=Math.max(width/video.videoWidth,height/video.videoHeight);
 dx=(width-video.videoWidth*scale)/2;
 dy=(height-video.videoHeight*scale)/2;
}
window.addEventListener("resize",()=>{
 if(video.videoWidth)resize();
});

function drawCamera(c){
 c.save();
 c.translate(dx,dy);
 if(facing==="user"){
  c.translate(video.videoWidth*scale,0);
  c.scale(-1,1);
 }
 c.drawImage(video,0,0,
  video.videoWidth*scale,
  video.videoHeight*scale);
 c.restore();
}

function point(p){
 return {
  x:dx+(facing==="user"?1-p.x:p.x)*video.videoWidth*scale,
  y:dy+p.y*video.videoHeight*scale
 };
}
function distance(a,b){
 return Math.hypot(a.x-b.x,a.y-b.y);
}
function lerp(a,b,t){return a+(b-a)*t}

function trackHand(result,time){
 if(!result.landmarks?.length){
  if(time-lastSeen>250){open=false;hand=null}
  return;
 }
 lastSeen=time;
 const p=result.landmarks[0].map(point);
 const wrist=p[0],middle=p[9];
 const palm={
  x:(p[0].x+p[5].x+p[9].x+p[17].x)/4,
  y:(p[0].y+p[5].y+p[9].y+p[17].y)/4
 };
 const vx=middle.x-wrist.x;
 const vy=middle.y-wrist.y;
 const len=Math.hypot(vx,vy)||1;
 const palmWidth=distance(p[5],p[17]);

 // Положение шара над ладонью
 const target={
  x:palm.x+vx/len*len*.48,
  y:palm.y+vy/len*len*.48,
  r:Math.max(18,Math.min(width*.32,palmWidth*.65)),
  points:p
 };

 // Проверяем раскрытие четырёх пальцев
 let extended=0;
 const tips=[8,12,16,20];
 const joints=[6,10,14,18];
 for(let i=0;i<4;i++){
  if(distance(p[tips[i]],p[0])>
     distance(p[joints[i]],p[0])*1.13){
   extended++;
  }
 }
 open=extended>=3;

 if(!hand)hand=target;
 else{
  hand.x=lerp(hand.x,target.x,.25);
  hand.y=lerp(hand.y,target.y,.25);
  hand.r=lerp(hand.r,target.r,.2);
  hand.points=p;
 }
}

function fireball(x,y,r,time){
 ctx.save();
 ctx.globalCompositeOperation="screen";

 // Свечение
 let glow=ctx.createRadialGradient(x,y,0,x,y,r*2.5);
 glow.addColorStop(0,"#fff0a080");
 glow.addColorStop(.3,"#ff9a2480");
 glow.addColorStop(.65,"#ff450a35");
 glow.addColorStop(1,"#ff330000");
 ctx.fillStyle=glow;
 ctx.beginPath();
 ctx.arc(x,y,r*2.5,0,Math.PI*2);
 ctx.fill();

 // Живые языки пламени
 for(let i=0;i<45;i++){
  const phase=(i*.618+time*.35)%1;
  const angle=i*2.399+time*.4;
  const px=x+Math.cos(angle)*r*phase*.8;
  const py=y+Math.sin(angle)*r*phase*.6-phase*r*.5;
  const size=r*(.13+.2*(1-phase));
  const g=ctx.createRadialGradient(px,py,0,px,py,size*2);
  g.addColorStop(0,"#fff5b6cc");
  g.addColorStop(.4,"#ff9b23bb");
  g.addColorStop(1,"#ff310000");
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(px,py,size*2,0,Math.PI*2);
  ctx.fill();
 }

 // Горячее ядро
 const core=ctx.createRadialGradient(
  x-r*.15,y-r*.2,0,x,y,r);
 core.addColorStop(0,"#fffde6");
 core.addColorStop(.2,"#ffed91");
 core.addColorStop(.5,"#ff971d");
 core.addColorStop(.85,"#f53b08aa");
 core.addColorStop(1,"#ff300000");
 ctx.fillStyle=core;
 ctx.beginPath();
 ctx.arc(x,y,r*(1+.05*Math.sin(time*8)),0,Math.PI*2);
 ctx.fill();

 // Искры
 for(let i=0;i<35;i++){
  const phase=(i*.37+time*(.3+i%5*.04))%1;
  const a=i*2.4;
  const px=x+Math.sin(a)*r*(.2+phase);
  const py=y-r*(.2+phase*1.6);
  ctx.globalAlpha=(1-phase)*.8;
  ctx.fillStyle=i%3?"#ffae40":"#fff0b0";
  ctx.beginPath();
  ctx.arc(px,py,Math.max(1,r*.025),0,Math.PI*2);
  ctx.fill();
 }
 ctx.restore();
}

function occludeHand(p){
 maskCtx.clearRect(0,0,width,height);
 maskCtx.fillStyle="white";
 maskCtx.strokeStyle="white";
 maskCtx.lineCap="round";
 maskCtx.lineJoin="round";

 const palmWidth=distance(p[5],p[17]);

 // Приблизительная маска ладони
 maskCtx.beginPath();
 [0,1,2,5,9,13,17].forEach((id,i)=>{
  if(i===0)maskCtx.moveTo(p[id].x,p[id].y);
  else maskCtx.lineTo(p[id].x,p[id].y);
 });
 maskCtx.closePath();
 maskCtx.fill();

 // Маски пальцев
 const chains=[
  [0,1,2,3,4],
  [0,5,6,7,8],
  [0,9,10,11,12],
  [0,13,14,15,16],
  [0,17,18,19,20]
 ];
 chains.forEach((chain,i)=>{
  maskCtx.lineWidth=palmWidth*(i===0?.25:.2);
  maskCtx.beginPath();
  chain.forEach((id,j)=>{
   if(j===0)maskCtx.moveTo(p[id].x,p[id].y);
   else maskCtx.lineTo(p[id].x,p[id].y);
  });
  maskCtx.stroke();
 });

 fgCtx.clearRect(0,0,width,height);
 drawCamera(fgCtx);
 fgCtx.globalCompositeOperation="destination-in";
 fgCtx.drawImage(mask,0,0);
 fgCtx.globalCompositeOperation="source-over";
 ctx.drawImage(foreground,0,0);
}

function render(time){
 if(!running)return;

 if(video.readyState>=2){
  drawCamera(ctx);

  if(detector&&video.currentTime!==lastVideoTime){
   lastVideoTime=video.currentTime;
   try{
    const result=detector.detectForVideo(video,time);
    trackHand(result,time);
    status.textContent=result.landmarks?.length?
      (open?"🔥 Ладонь открыта":"Раскрой ладонь"):
      "Покажи ладонь";
   }catch(e){
    status.textContent="Ошибка распознавания";
   }
  }

  strength+=((hand&&open?1:0)-strength)*.13;

  if(hand&&strength>.01){
   ctx.save();
   ctx.globalAlpha=Math.min(1,strength);
   fireball(hand.x,hand.y,hand.r*strength,time*.001);
   ctx.restore();
   occludeHand(hand.points);
  }
 }
 requestAnimationFrame(render);
}

async function loadModel(){
 status.textContent="Загрузка распознавания...";

 const {HandLandmarker,FilesetResolver}=await import(
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm"
 );

 const vision=await FilesetResolver.forVisionTasks(
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
 );

 const options={
  baseOptions:{
   modelAssetPath:
    "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
   delegate:"GPU"
  },
  runningMode:"VIDEO",
  numHands:1
 };

 try{
  return await HandLandmarker.createFromOptions(vision,options);
 }catch(e){
  options.baseOptions.delegate="CPU";
  return await HandLandmarker.createFromOptions(vision,options);
 }
}

async function openCamera(){
 if(stream)stream.getTracks().forEach(t=>t.stop());

 stream=await navigator.mediaDevices.getUserMedia({
  audio:false,
  video:{
   facingMode:{ideal:facing},
   width:{ideal:1280},
   height:{ideal:720}
  }
 });

 video.srcObject=stream;
 await video.play();

 if(!video.videoWidth){
  await new Promise(resolve=>{
   video.addEventListener("loadedmetadata",resolve,{once:true});
  });
 }
 resize();
 hand=null;
 open=false;
 lastVideoTime=-1;
}

start.onclick=async()=>{
 start.disabled=true;
 error.textContent="";
 try{
  if(!navigator.mediaDevices?.getUserMedia){
   throw Error("Нужен HTTPS и доступ к камере.");
  }

  // Сначала камера, потом распознавание
  await openCamera();
  overlay.classList.add("hidden");
  running=true;
  switchBtn.disabled=false;
  requestAnimationFrame(render);

  try{
   detector=await loadModel();
   status.textContent="Покажи ладонь";
  }catch(e){
   console.error(e);
   status.textContent="Ошибка загрузки модели";
  }

 }catch(e){
  error.textContent=
   "Ошибка камеры: "+e.name+"\n"+e.message;
  status.textContent="Камера недоступна";
 }finally{
  start.disabled=false;
 }
};

switchBtn.onclick=async()=>{
 switchBtn.disabled=true;
 facing=facing==="user"?"environment":"user";
 try{await openCamera()}
 catch(e){status.textContent="Ошибка смены камеры"}
 switchBtn.disabled=false;
};
</script>
</body>
</html>
