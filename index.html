
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Fire Cam 0.9</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;
 overflow:hidden;background:#000;color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif
}
video{display:none}
canvas{
 position:fixed;inset:0;width:100%;height:100%;
 pointer-events:none
}
.ui{
 position:fixed;inset:0;
 display:flex;flex-direction:column;
 justify-content:space-between;
 padding:calc(env(safe-area-inset-top) + 18px) 16px
 calc(env(safe-area-inset-bottom) + 18px);
 pointer-events:none
}
.top{
 display:flex;align-items:flex-start;
 justify-content:space-between;gap:10px
}
.brand{
 font-size:23px;font-weight:900;
 text-shadow:0 2px 8px #000
}
#status{
 max-width:58%;padding:12px;
 background:#111c;border-radius:16px;
 font-size:12px;text-align:center
}
.controls{
 display:flex;flex-direction:column;gap:11px
}
button{
 pointer-events:auto;width:100%;
 padding:17px 12px;border:0;
 border-radius:17px;font-size:16px;
 font-weight:800;background:#ff792e;
 color:#180b03
}
button.secondary{
 background:#ffffff38;color:white;
 backdrop-filter:blur(12px);
 -webkit-backdrop-filter:blur(12px)
}
button:disabled{opacity:.5}
.hint{
 text-align:center;font-size:13px;
 line-height:1.5;text-shadow:0 2px 8px #000
}
#debug{
 display:none;background:#171717ed;
 padding:12px;border-radius:12px;
 font-size:12px;white-space:pre-wrap;
 overflow-wrap:anywhere;max-height:140px;
 overflow:auto;pointer-events:auto
}
#debug.show{display:block}
#overlay{
 position:fixed;inset:0;z-index:10;
 display:flex;align-items:center;
 justify-content:center;text-align:center;
 background:radial-gradient(#492316,#090909 75%);
 padding:25px
}
.panel{width:100%;max-width:360px}
.panel h1{font-size:40px}
.panel p{line-height:1.5;color:#ddd}
#error{color:#ffb9a5;white-space:pre-wrap}
</style>
</head>
<body>

<video id="video" autoplay muted playsinline></video>
<canvas id="scene"></canvas>

<div class="ui">
 <div class="top">
  <div class="brand">🔥 FIRE CAM</div>
  <div id="status">Камера выключена</div>
 </div>

 <div class="controls">
  <div id="debug"></div>
  <div class="hint">
   Разводи пальцы — увеличивай огонь.<br>
   Разверни ладонь — выстрели.
  </div>
  <button id="scan" disabled>
   ✋ Включить сканирование
  </button>
  <button id="switch" class="secondary" disabled>
   ↻ Сменить камеру
  </button>
 </div>
</div>

<div id="overlay">
 <div class="panel">
  <h1>🔥 FIRE CAM</h1>
  <p>Магический огонь в твоей ладони</p>
  <button id="start">Включить камеру</button>
  <p id="error"></p>
 </div>
</div>

<script type="module">
const $=id=>document.getElementById(id);
const video=$("video");
const canvas=$("scene");
const ctx=canvas.getContext("2d",{alpha:false});
const status=$("status");
const scanBtn=$("scan");
const switchBtn=$("switch");
const debug=$("debug");

const VERSION="0.10.14";
const BASES=[
 "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@"+VERSION,
 "https://unpkg.com/@mediapipe/tasks-vision@"+VERSION
];
const MODEL=
 "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

let detector=null,stream=null;
let running=false,scanning=false,loading=false;
let facing="environment";

let W=0,H=0,scale=1,dx=0,dy=0;
let hand=null,palmOpen=false,firePower=0;
let lastSeen=0,lastVideoTime=-1,lastDetection=0;
let lastTick=0;

let shot=null;
let shotArmed=true;
let turnStarted=0;
let stableOrientation="unknown";
let candidateOrientation="unknown";
let candidateSince=0;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function setStatus(s){status.textContent=s}
function showError(s){
 debug.textContent=s;
 debug.classList.add("show");
 console.error(s);
}
function clearError(){
 debug.textContent="";
 debug.classList.remove("show");
}

function resize(){
 if(!video.videoWidth)return;
 const d=Math.min(devicePixelRatio||1,1.25);
 W=canvas.width=Math.round(innerWidth*d);
 H=canvas.height=Math.round(innerHeight*d);
 scale=Math.max(W/video.videoWidth,H/video.videoHeight);
 dx=(W-video.videoWidth*scale)/2;
 dy=(H-video.videoHeight*scale)/2;
}
addEventListener("resize",resize);

function drawVideo(){
 ctx.save();
 ctx.translate(dx,dy);
 if(facing==="user"){
  ctx.translate(video.videoWidth*scale,0);
  ctx.scale(-1,1);
 }
 ctx.drawImage(video,0,0,
  video.videoWidth*scale,video.videoHeight*scale);
 ctx.restore();
}

function point(p){
 return {
  x:dx+(facing==="user"?1-p.x:p.x)
    *video.videoWidth*scale,
  y:dy+p.y*video.videoHeight*scale,
  z:p.z||0
 };
}

function getOrientation(raw){
 const a=raw[5],b=raw[17],c=raw[0];
 const cross=(b.x-a.x)*(c.y-a.y)-
             (b.y-a.y)*(c.x-a.x);

 // Side is only a transitional orientation.
 if(Math.abs(cross)<.012)return "side";

 const back=facing==="user"?cross<0:cross>0;
 return back?"back":"front";
}

function updateOrientation(value,time){
 if(value!==candidateOrientation){
  candidateOrientation=value;
  candidateSince=time;
 }
 if(time-candidateSince>110){
  stableOrientation=value;
 }
}

function fingerSpread(p,span){
 // Distances between adjacent fingertips,
 // normalized by the width of the palm.
 const tips=[8,12,16,20];
 let total=0;
 for(let i=0;i<3;i++){
  total+=dist(p[tips[i]],p[tips[i+1]]);
 }
 const ratio=total/(span||1);

 // Normalize spread to 0..1.
 return clamp((ratio-1.25)/1.45,0,1);
}

function updateHand(result,time){
 const raw=result?.landmarks?.[0];

 if(!raw){
  if(time-lastSeen>350){
   palmOpen=false;
   hand=null;
   turnStarted=0;
  }
  return;
 }

 lastSeen=time;
 const p=raw.map(point);
 const span=dist(p[5],p[17]);

 const center={
  x:(p[0].x+p[5].x+p[9].x+p[17].x)/4,
  y:(p[0].y+p[5].y+p[9].y+p[17].y)/4
 };

 let extended=0;
 for(const [tip,joint] of [
  [8,6],[12,10],[16,14],[20,18]
 ]){
  if(dist(p[tip],p[0])>
     dist(p[joint],p[0])*1.12){
   extended++;
  }
 }
 palmOpen=extended>=3;

 const orientation=getOrientation(raw);
 updateOrientation(orientation,time);

 const spread=fingerSpread(p,span);

 // Keep ball size stable when palm turns sideways.
 const sizeBase=hand?.baseSpan||span;
 const safeSpan=clamp(
  span,
  sizeBase*.65,
  sizeBase*1.45
 );

 // Ball position: slightly above palm toward fingers.
 const vx=p[9].x-p[0].x;
 const vy=p[9].y-p[0].y;
 const len=Math.hypot(vx,vy)||1;
 const ux=vx/len,uy=vy/len;

 const target={
  x:center.x+ux*safeSpan*.6,
  y:center.y+uy*safeSpan*.6,
  r:clamp(safeSpan*(.48+spread*.52),22,W*.32),
  baseSpan:lerp(sizeBase,span,.035),
  spread,
  orientation:stableOrientation
 };

 if(!hand){
  hand=target;
 }else{
  hand.x=lerp(hand.x,target.x,.27);
  hand.y=lerp(hand.y,target.y,.27);
  hand.r=lerp(hand.r,target.r,.18);
  hand.spread=lerp(hand.spread,spread,.18);
  hand.baseSpan=target.baseSpan;
  hand.orientation=stableOrientation;
 }

 handleGesture(time);
}

function handleGesture(time){
 if(!hand||!palmOpen){
  turnStarted=0;
  return;
 }

 if(hand.orientation==="front"){
  if(!shot){
   shotArmed=true;
  }
  turnStarted=0;
 }else if(hand.orientation==="side"){
  // Sideways palm never removes the fireball.
  turnStarted=0;
 }else if(hand.orientation==="back"){
  if(shotArmed&&!shot){
   if(!turnStarted)turnStarted=time;
   if(time-turnStarted>220){
    shoot(time);
    shotArmed=false;
    turnStarted=0;
   }
  }
 }
}

function shoot(time){
 if(!hand)return;
 shot={
  x:hand.x,
  y:hand.y,
  r:hand.r*1.25,
  start:time,
  duration:1100
 };
 setStatus("🔥 ОГНЕННЫЙ ВЫСТРЕЛ!");
}

function fireball(x,y,r,t,alpha=1,boost=1){
 if(r<1||alpha<=0)return;
 ctx.save();
 ctx.globalAlpha=alpha;
 ctx.globalCompositeOperation="screen";

 // Warm outer glow.
 const glow=ctx.createRadialGradient(x,y,0,x,y,r*2.5);
 glow.addColorStop(0,"rgba(255,180,65,.45)");
 glow.addColorStop(.25,"rgba(255,105,15,.3)");
 glow.addColorStop(.65,"rgba(255,50,0,.09)");
 glow.addColorStop(1,"rgba(255,30,0,0)");
 ctx.fillStyle=glow;
 ctx.beginPath();
 ctx.arc(x,y,r*2.5,0,Math.PI*2);
 ctx.fill();

 // Soft moving flame particles.
 for(let i=0;i<52;i++){
  const q=(i*.618033+t*(.25+i%5*.03))%1;
  const a=i*2.399+t*.4;
  const px=x+Math.cos(a)*r*q*.75;
  const py=y+Math.sin(a)*r*q*.45-q*r*.65;
  const size=r*(.09+.17*(1-q))*boost;

  const g=ctx.createRadialGradient(
   px,py,0,px,py,size*2
  );
  g.addColorStop(0,"rgba(255,245,175,.65)");
  g.addColorStop(.35,"rgba(255,150,25,.55)");
  g.addColorStop(1,"rgba(255,50,0,0)");

  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(px,py,size*2,0,Math.PI*2);
  ctx.fill();
 }

 // Bright golden center.
 const core=ctx.createRadialGradient(
  x-r*.2,y-r*.2,0,x,y,r
 );
 core.addColorStop(0,"rgba(255,253,220,.95)");
 core.addColorStop(.22,"rgba(255,230,120,.95)");
 core.addColorStop(.55,"rgba(255,140,25,.85)");
 core.addColorStop(.85,"rgba(255,65,0,.5)");
 core.addColorStop(1,"rgba(255,45,0,0)");
 ctx.fillStyle=core;
 ctx.beginPath();
 ctx.arc(x,y,r*(1+.035*Math.sin(t*8)),0,Math.PI*2);
 ctx.fill();

 // Small irregular sparks.
 for(let i=0;i<22;i++){
  const q=(i*.37+t*(.28+i%4*.05))%1;
  const a=i*2.4;
  const px=x+Math.sin(a)*r*(.2+q);
  const py=y-r*(.2+q*1.4);
  ctx.globalAlpha=alpha*(1-q)*.65;
  ctx.fillStyle=i%3?"#ffac40":"#fff0b0";
  ctx.beginPath();
  ctx.arc(px,py,Math.max(1,r*.018),0,Math.PI*2);
  ctx.fill();
 }
 ctx.restore();
}

function renderHeldFire(time){
 if(!hand||firePower<.01)return;

 const t=time/1000;

 // Visible vertical floating motion.
 const bob=Math.sin(t*2.5)*hand.r*.17;
 const drift=Math.sin(t*1.3)*hand.r*.055;

 fireball(
  hand.x+drift,
  hand.y+bob,
  hand.r*firePower,
  t,
  firePower
 );
}

function renderShot(time){
 if(!shot)return;
 const p=(time-shot.start)/shot.duration;
 if(p>=1){
  shot=null;
  return;
 }

 const q=clamp(p,0,1);
 const ease=1-Math.pow(1-q,2.5);

 // Large initial burst, then movement away.
 const burst=1+1.05*Math.sin(Math.min(1,q*3)*Math.PI/2);
 const r=shot.r*burst*(1-.86*ease);
 const x=shot.x;
 const y=shot.y-shot.r*.65*ease;
 const alpha=Math.pow(1-q,.7);

 // Flame trail behind projectile.
 for(let i=6;i>=1;i--){
  const lag=Math.max(0,q-i*.035);
  const le=1-Math.pow(1-lag,2.5);
  const ly=shot.y-shot.r*.65*le;
  const lr=shot.r*(1-.86*le)*(.3+i*.035);
  fireball(x,ly,lr,time/1000-i*.06,
   alpha*.08,1);
 }

 fireball(x,y,r,time/1000,alpha,1.15);
}

function render(time){
 if(!running)return;

 if(video.readyState>=2){
  ctx.clearRect(0,0,W,H);
  drawVideo();

  if(scanning&&detector&&
     video.currentTime!==lastVideoTime&&
     time-lastDetection>=65){

   lastVideoTime=video.currentTime;
   lastDetection=time;

   try{
    const result=detector.detectForVideo(video,time);
    updateHand(result,time);

    if(!result.landmarks?.length){
     setStatus("✋ Покажи руку");
    }else if(!palmOpen){
     setStatus("✊ Раскрой ладонь");
    }else if(hand?.orientation==="side"){
     setStatus("🔥 Огонь над ладонью");
    }else if(hand?.orientation==="back"){
     setStatus("🔥 Огненный выстрел");
    }else{
     setStatus("🔥 Разводи пальцы");
    }
   }catch(e){
    showError("Ошибка распознавания: "+e.message);
    stopScanning();
   }
  }

  if(scanning){
   if(time-lastSeen>350)palmOpen=false;

   const dt=Math.min(50,time-(lastTick||time));
   const smooth=1-Math.exp(-dt/120);

   const visible=hand&&palmOpen&&shotArmed;
   firePower=lerp(
    firePower,
    visible?1:0,
    smooth
   );

   renderHeldFire(time);
   renderShot(time);
  }else{
   firePower=0;
  }
 }

 lastTick=time;
 requestAnimationFrame(render);
}

async function openCamera(){
 if(stream){
  stream.getTracks().forEach(t=>t.stop());
 }
 stream=null;

 stream=await navigator.mediaDevices.getUserMedia({
  audio:false,
  video:{
   facingMode:{ideal:facing},
   width:{ideal:1280},
   height:{ideal:720}
  }
 });

 video.srcObject=stream;
 await video.play();

 if(!video.videoWidth){
  await new Promise(resolve=>{
   video.addEventListener(
    "loadedmetadata",resolve,{once:true}
   );
  });
 }

 resize();
 hand=null;
 palmOpen=false;
 firePower=0;
 shot=null;
 shotArmed=true;
 turnStarted=0;
 stableOrientation="unknown";
 candidateOrientation="unknown";
 lastVideoTime=-1;
 lastSeen=0;
}

async function createDetector(){
 const errors=[];

 for(const base of BASES){
  try{
   setStatus("Загрузка MediaPipe...");
   const mod=await import(base+"/vision_bundle.mjs");
   const vision=await mod.FilesetResolver.forVisionTasks(
    base+"/wasm"
   );

   for(const delegate of ["GPU","CPU"]){
    try{
     setStatus("Запуск распознавания...");
     return await mod.HandLandmarker.createFromOptions(
      vision,{
       baseOptions:{
        modelAssetPath:MODEL,
        delegate
       },
       runningMode:"VIDEO",
       numHands:1,
       minHandDetectionConfidence:.55,
       minHandPresenceConfidence:.55,
       minTrackingConfidence:.5
      }
     );
    }catch(e){
     errors.push(delegate+": "+e.message);
    }
   }
  }catch(e){
   errors.push(base+": "+e.message);
  }
 }

 throw Error(errors.join("\n"));
}

function stopScanning(){
 scanning=false;
 palmOpen=false;
 hand=null;
 firePower=0;
 shot=null;
 shotArmed=true;
 turnStarted=0;
 scanBtn.textContent="✋ Включить сканирование";
 setStatus("Сканирование выключено");
}

async function startScanning(){
 if(loading)return;
 loading=true;
 scanBtn.disabled=true;
 scanBtn.textContent="⏳ Загрузка...";
 clearError();

 try{
  if(!detector){
   detector=await createDetector();
  }
  scanning=true;
  shotArmed=true;
  lastSeen=0;
  lastVideoTime=-1;
  scanBtn.textContent="⏹ Выключить сканирование";
  setStatus("✋ Покажи ладонь");
 }catch(e){
  scanning=false;
  showError("Ошибка модели:\n"+e.message);
  setStatus("Ошибка сканирования");
  scanBtn.textContent="↻ Повторить сканирование";
 }finally{
  loading=false;
  scanBtn.disabled=false;
 }
}

scanBtn.onclick=()=>{
 if(loading)return;
 if(scanning)stopScanning();
 else startScanning();
};

$("start").onclick=async()=>{
 const btn=$("start");
 btn.disabled=true;
 $("error").textContent="";

 try{
  if(!navigator.mediaDevices?.getUserMedia){
   throw Error("Нужен HTTPS и доступ к камере");
  }

  await openCamera();
  $("overlay").style.display="none";
  scanBtn.disabled=false;
  switchBtn.disabled=false;

  if(!running){
   running=true;
   requestAnimationFrame(render);
  }
  setStatus("Камера работает");
 }catch(e){
  $("error").textContent=e.message;
 }finally{
  btn.disabled=false;
 }
};

switchBtn.onclick=async()=>{
 switchBtn.disabled=true;
 const previous=facing;
 facing=facing==="user"?"environment":"user";

 try{
  await openCamera();
  setStatus(scanning?
   "✋ Покажи ладонь":"Камера работает");
 }catch(e){
  facing=previous;
  showError("Ошибка камеры: "+e.message);
 }
 switchBtn.disabled=false;
};
</script>
</body>
</html>
